source = "Dungeon Master's Guide, p. 276"
description = """
When you hit a Fiend or an Undead with this magic weapon, that creature takes an extra 2d6 Radiant damage. If the target has 25 [[glossary:Hit Points]] or fewer after taking this damage, it must succeed on a DC 15 Wisdom saving throw or be destroyed. On a successful save, the creature has the [[glossary:Frightened]] condition until the end of your next turn.

**_Light._** While you hold this weapon, it sheds [[glossary:Bright Light]] in a 20-foot radius and [[glossary:Dim Light]] for an additional 20 feet.
"""
