title = "Summon Fey"
spell_lists = ["Druid", "Ranger", "Warlock", "Wizard"]
level = "3"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "90 feet"
components = ["V", "S", "M"]
material = "a gilded flower worth 300+ GP"
expensive_material_component = true
material_component_cost = 30000
material_component_consumed = false
duration = "1 hour"
description = """
You call forth a Fey spirit. It manifests in an unoccupied space that you can see within range and uses the [[[monster:Fey Spirit]]] stat block. When you cast the spell, choose a mood: Fuming, Mirthful, or Tricksy. The creature resembles a Fey creature of your choice marked by the chosen mood, which determines certain details in its stat block. The creature disappears when it drops to 0 [[glossary:Hit Points]] or when the spell ends.

The creature is an ally to you and your allies. In combat, the creature shares your [[glossary:Initiative]] count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the [[glossary:Dodge]] action and uses its movement to avoid danger.
"""
at_higher_levels = "Use the spell slot's level for the spell's level in the stat block."
source = "Player's Handbook, p. 326"
