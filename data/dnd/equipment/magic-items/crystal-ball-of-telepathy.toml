tables = ["Arcana"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 159"
description = "While touching this crystal orb, you can cast [[[spell:Scrying]]] (save DC 17) with it. In addition, you can communicate telepathically with creatures you can see within 30 feet of the spell's sensor. You can also cast [[[spell:Suggestion]]] (save DC 17) through the sensor on one of those creatures. You don't need to concentrate on this [[[spell:Suggestion]]] to maintain it during its duration, but it ends if [[[spell:Scrying]]] ends. You can't cast [[[spell:Suggestion]]] in this way again until the next dawn."
