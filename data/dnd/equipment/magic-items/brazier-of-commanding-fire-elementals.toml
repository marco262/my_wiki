source = "Dungeon Master's Guide, p. 241"
description = "While you are within 5 feet of this brazier, you can take a [[glossary:Magic]] action to summon a [[[monster:Fire Elemental]]]. The elemental appears in an unoccupied space as close to the brazier as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your [[glossary:Initiative]] count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a [[glossary:Bonus Action]]. The brazier can't be used this way again until the next dawn."
