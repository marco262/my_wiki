duration = "8 hours"
description = """
You set an alarm against intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot [[glossary:Cube]]. Until the spell ends, an alarm alerts you whenever a creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is audible or mental:

 - **Audible Alarm.** The alarm produces the sound of a handbell for 10 seconds within 60 feet of the warded area.
 - **Mental Alarm.** You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you're asleep.
"""
source = "Player's Handbook, p. 239"
