source = "Dungeon Master's Guide, p. 270"
description = """
You can take a [[glossary:Magic]] action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the [[[monster:Berserker]]] stat block and returns to Ysgard after 1 hour or when it drops to 0 [[glossary:Hit Points]]. The spirits look like living, breathing warriors, and they have [[glossary:Immunity]] to the [[glossary:Charmed]] and [[glossary:Frightened]] conditions. Once you use the horn, it can't be used again until 7 days have passed.

A bronze horn summons 4 [[[monster:Berserker]]]. To use the bronze horn, you must have training with all Medium armor.

If you blow the horn without meeting its requirement, the summoned [[[monster:Berserker]]] attack you. If you meet the requirement, they are [[glossary:Friendly]] to you and your allies and follow your commands.
"""
