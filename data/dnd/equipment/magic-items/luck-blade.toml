name = "Luck Blade"
type = "Weapon"
subtype = { requires = ["Glaive", "Greatsword", "Longsword", "Rapier", "Scimitar", "Sickle", "Shortsword"] }
rarity = "Legendary"
tables = ["Armaments"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 275"
description = """
You gain a +1 bonus to attack rolls and damage rolls made with this magic weapon. While the weapon is on your person, you also gain a {=bonusSavingThrow} bonus to saving throws.

**_Luck._** If the weapon is on your person, you can call on its luck (no action required) to reroll one failed [[glossary:D20 Test]] if you don't have the [[glossary:Incapacitated]] condition. You must use the second roll. Once used, this property can't be used again until the next dawn.

**_Wish._** The weapon has 1d3 charges. While holding it, you can expend 1 charge and cast [[[spell:Wish]]] from it. Once used, this property can't be used again until the next dawn. The weapon loses this property if it has no charges.
"""
