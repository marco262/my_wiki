title = "Speak with Plants"
spell_lists = ["Bard", "Druid", "Ranger"]
level = "3"
school = "Transmutation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Self (30-foot [[glossary:emanation]])"
components = ["V", "S"]
duration = "10 minutes"
description = """
You imbue plants in an immobile 30-foot [[glossary:Emanation]] with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances.

You can also turn [[glossary:Difficult Terrain]] caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into [[glossary:Difficult Terrain]] that lasts for the duration.

The spell doesn't enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you.

If a Plant creature is in the area, you can communicate with it as if you shared a common language.
"""
source = "Player's Handbook, p. 319"
