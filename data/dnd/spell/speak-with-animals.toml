title = "Speak with Animals"
spell_lists = ["Bard", "Druid", "Ranger", "Warlock"]
level = "1"
school = "Divination"
concentration_spell = false
ritual_spell = true
casting_time = "Action"
range = "Self"
components = ["V", "S"]
duration = "10 minutes"
description = """
For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the [[glossary:Influence]] action's skill options with them.

Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.
"""
source = "Player's Handbook, p. 318"
