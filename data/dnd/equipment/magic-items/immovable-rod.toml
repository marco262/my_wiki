source = "Dungeon Master's Guide, p. 270"
description = "This iron rod has a button on one end. You can take a [[glossary:Utilize]] action to press the button, which causes the rod to become magically fixed in place. Until you or another creature takes a [[glossary:Utilize]] action to push the button again, the rod doesn't move, even if it defies gravity. The rod can hold up to 8,000 pounds of weight. More weight causes the rod to deactivate and fall. A creature can take a [[glossary:Utilize]] action to make a DC 30 Strength ([[tooltip:Athletics]]) check, moving the fixed rod up to 10 feet on a successful check."
