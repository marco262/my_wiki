source = "Dungeon Master's Guide, p. 297"
description = """
This robe is adorned with eyelike patterns. While you wear the robe, you gain the following benefits:

 - **All-Around Vision.** The robe gives you [[glossary:Advantage]] on Wisdom ([[tooltip:Perception]]) checks that rely on sight.
 - **Special Senses.** You have [[glossary:Darkvision]] and [[glossary:Truesight]], both with a range of 120 feet.

**_Drawbacks._** A [[[spell:Light]]] spell cast on the robe or a [[[spell:Daylight]]] spell cast within 5 feet of the robe gives you the [[glossary:Blinded]] condition for 1 minute. At the end of each of your turns, you make a Constitution saving throw (DC 11 for Light or DC 15 for Daylight), ending the condition on yourself on a success.
"""
