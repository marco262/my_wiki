title = "Cloudkill"
spell_lists = ["Sorcerer", "Wizard"]
level = "5"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S"]
duration = "10 minutes"
description = """
You create a 20-foot-radius [[glossary:Sphere]] of yellow-green fog centered on a point within range. The fog lasts for the duration or until strong wind (such as the one created by _[[[spell:Gust of Wind]]]_) disperses it, ending the spell. Its area is [[glossary:Heavily Obscured]].

Each creature in the [[glossary:Sphere]] makes a Constitution saving throw, taking 5d8 Poison damage on a failed save or half as much damage on a successful one. A creature must also make this save when the [[glossary:Sphere]] moves into its space and when it enters the [[glossary:Sphere]] or ends its turn there. A creature makes this save only once per turn.

The [[glossary:Sphere]] moves 10 feet away from you at the start of each of your turns.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 5."
source = "Player's Handbook, p. 251"
