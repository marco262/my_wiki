source = "Dungeon Master's Guide, p. 235"
description = """
While wearing this belt, you gain the following benefits:

 - **Dwarvish.** You know Dwarvish.
 - **Friend of Dwarvenkind.** You have [[glossary:Advantage]] on Charisma ([[tooltip:Persuasion]]) checks made to interact with dwarves and duergar.
 - **Toughness.** Your Constitution increases by 2, to a maximum of 20.

In addition, while attuned to the belt, you have a {@chance 50} chance each day at dawn of growing a full beard if you can grow one, or a thicker beard if you already have one.

If you aren't a dwarf or duergar, you gain the following additional benefits while wearing the belt:
 - **Darkvision.** You have [[glossary:Darkvision]] with a range of 60 feet.
 - **Resilience.** You have [[glossary:Resistance]] to Poison damage. You also have [[glossary:Advantage]] on saving throws you make to avoid or end the [[glossary:Poisoned]] condition.
"""
