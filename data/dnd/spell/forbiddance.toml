title = "Forbiddance"
spell_lists = ["Cleric"]
level = "6"
school = "Abjuration"
concentration_spell = false
ritual_spell = true
casting_time = "10 minutes"
range = "Touch"
components = ["V", "S", "M"]
material = "ruby dust worth 1,000+ GP"
expensive_material_component = true
material_component_cost = 100000
material_component_consumed = false
duration = "1 day"
description = """
You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can't teleport into the area or use portals, such as those created by the [[[spell:Gate]]] spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, the Ethereal Plane, the Feywild, the Shadowfell, or the [[[spell:Plane Shift]]] spell.

In addition, the spell damages types of creatures that you choose when you cast it. Choose one or more of the following: Aberrations, Celestials, Elementals, Fey, Fiends, and Undead. When a creature of a chosen type enters the spell's area for the first time on a turn or ends its turn there, the creature takes 5d10 Radiant or Necrotic damage (your choice when you cast this spell).

You can designate a password when you cast the spell. A creature that speaks the password as it enters the area takes no damage from the spell.

The spell's area can't overlap with the area of another Forbiddance spell. If you cast [[[spell:Forbiddance]]] every day for 30 days in the same location, the spell lasts until it is dispelled, and the Material components are consumed on the last casting.
"""
source = "Player's Handbook, p. 276"
