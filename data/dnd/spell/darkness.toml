title = "Darkness"
spell_lists = ["Sorcerer", "Warlock", "Wizard"]
level = "2"
school = "Evocation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "M"]
material = "bat fur and a piece of coal"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "10 minutes"
description = """
For the duration, magical [[glossary:Darkness]] spreads from a point within range and fills a 15-foot-radius [[glossary:Sphere]]. [[glossary:Darkvision]] can't see through it, and nonmagical light can't illuminate it.

Alternatively, you cast the spell on an object that isn't being worn or carried, causing the [[glossary:Darkness]] to fill a 15-foot [[glossary:Emanation]] originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the [[glossary:Darkness]].

If any of this spell's area overlaps with an area of [[glossary:Bright Light]] or [[glossary:Dim Light]] created by a spell of level 2 or lower, that other spell is dispelled.
"""
source = "Player's Handbook, p. 260"
