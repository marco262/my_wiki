title = "Magic Circle"
spell_lists = ["Cleric", "Paladin", "Warlock", "Wizard"]
level = "3"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "1 minute"
range = "10 feet"
components = ["V", "S", "M"]
material = "salt and powdered silver worth 100+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 10000
material_component_consumed = true
duration = "1 hour"
description = """
You create a 10-foot-radius, 20-foot-tall [[glossary:Cylinder]] of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the [[glossary:Cylinder]] intersects with the floor or other surface.

Choose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways:

 - The creature can't willingly enter the [[glossary:Cylinder]] by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw.
 - The creature has [[glossary:Disadvantage]] on attack rolls against targets within the [[glossary:Cylinder]].
 - Targets within the [[glossary:Cylinder]] can't be possessed by or gain the [[glossary:Charmed]] or [[glossary:Frightened]] condition from the creature.

Each time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the [[glossary:Cylinder]] and protecting targets outside it.
"""
at_higher_levels = "The duration increases by 1 hour for each spell slot level above 3."
source = "Player's Handbook, p. 293"
