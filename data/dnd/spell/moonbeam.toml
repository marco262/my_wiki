title = "Moonbeam"
spell_lists = ["Druid"]
level = "2"
school = "Evocation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S", "M"]
material = "a moonseed leaf"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high [[glossary:Cylinder]] centered on a point within range. Until the spell ends, [[glossary:Dim Light]] fills the [[glossary:Cylinder]], and you can take a [[glossary:Magic]] action on later turns to move the [[glossary:Cylinder]] up to 60 feet.

When the [[glossary:Cylinder]] appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the _[[[spell:Polymorph]]]_ spell, for example), it reverts to its true form and can't shape-shift until it leaves the [[glossary:Cylinder]]. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.
"""
at_higher_levels = "The damage increases by 1d10 for each spell slot level above 2."
source = "Player's Handbook, p. 300"
