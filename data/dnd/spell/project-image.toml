duration = "1 day"
description = """
You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you, but it is intangible. If the illusion takes any damage, it disappears, and the spell ends.

You can see through the illusion's eyes and hear through its ears as if you were in its space. As a [[glossary:Magic]] action, you can move it up to 60 feet and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly.

Physical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the [[glossary:Study]] action to examine the image can determine that it is an illusion with a successful Intelligence ([[tooltip:Investigation]]) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.
"""
source = "Player's Handbook, p. 309"
