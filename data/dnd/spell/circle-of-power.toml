title = "Circle of Power"
spell_lists = ["Cleric", "Paladin", "Wizard"]
level = "5"
school = "Abjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (30-foot [[glossary:emanation]])"
components = ["V"]
duration = "10 minutes"
description = "An aura radiates from you in a 30-foot [[glossary:Emanation]] for the duration. While in the aura, you and your allies have [[glossary:Advantage]] on saving throws against spells and other magical effects. When an affected creature makes a saving throw against a spell or magical effect that allows a save to take only half damage, it takes no damage if it succeeds on the save."
source = "Player's Handbook, p. 250"
