description = "You push a wave of blood in a 10ft cube adjacent to you. Creatures within that space must make a strength saving throw or get pushed 20ft away from the wave. If their movement is stopped prematurely they take 1d6 damage per 5ft of travel denied. If their movement would be stopped by a creature that creature may make a strength saving throw or take the same damage and both creatures are knocked prone."
