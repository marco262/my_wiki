source = "Dungeon Master's Guide, p. 159"
description = "While touching this crystal orb, you can cast [[[spell:Scrying]]] (save DC 17) with it. In addition, you can cast [[[spell:Detect Thoughts]]] (save DC 17) targeting creatures you can see within 30 feet of the spell's sensor. You don't need to concentrate on this [[[spell:Detect Thoughts]]] spell to maintain it during its duration, but it ends if the [[[spell:Scrying]]] spell ends."
