title = "Finger of Death"
spell_lists = ["Sorcerer", "Warlock", "Wizard"]
level = "7"
school = "Necromancy"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S"]
duration = "Instantaneous"
description = """
You unleash negative energy toward a creature you can see within range. The target makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failed save or half as much damage on a successful one.

A Humanoid killed by this spell rises at the start of your next turn as a [[[monster:Zombie]]] that follows your verbal orders.
"""
source = "Player's Handbook, p. 273"
