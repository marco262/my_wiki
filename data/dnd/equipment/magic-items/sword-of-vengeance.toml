name = "Sword of Vengeance"
type = "Weapon"
subtype = { requires = ["Glaive", "Greatsword", "Longsword", "Rapier", "Scimitar", "Shortsword"] }
rarity = "Uncommon"
tables = ["Armaments"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 206"
description = """
You gain a +1 bonus to attack rolls and damage rolls made with this magic weapon.

**_Curse._** This weapon is cursed and possessed by a vengeful spirit. Becoming attuned to it extends the curse to you. As long as you remain cursed, you are unwilling to part with the weapon, keeping it on your person at all times. While attuned to this weapon, you have [[glossary:Disadvantage]] on attack rolls made with weapons other than this one.

In addition, while the weapon is on your person, you must succeed on a DC 15 Wisdom saving throw whenever you take damage from another creature in combat. On a failed save, you must attack the creature that damaged you until you drop to 0 [[glossary:Hit Points]] or it does or until you can't reach the creature to make a melee attack against it.

You can break the curse in the usual ways. Alternatively, casting [[[spell:Banishment]]] on the weapon forces the vengeful spirit to leave it. The weapon then becomes a +1 Weapon with no other properties.
"""
