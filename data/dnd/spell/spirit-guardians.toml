title = "Spirit Guardians"
spell_lists = ["Cleric"]
level = "3"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (15-foot [[glossary:emanation]])"
components = ["V", "S", "M"]
material = "a prayer scroll"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "10 minutes"
description = """
Protective spirits flit around you in a 15-foot [[glossary:Emanation]] for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.

When you cast this spell, you can designate creatures to be unaffected by it. Any other creature's [[glossary:Speed]] is halved in the [[glossary:Emanation]], and whenever the [[glossary:Emanation]] enters a creature's space and whenever a creature enters the [[glossary:Emanation]] or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 3."
source = "Player's Handbook, p. 319"
