title = "Otto's Irresistible Dance"
spell_lists = ["Bard", "Wizard"]
level = "6"
school = "Enchantment"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "30 feet"
components = ["V"]
duration = "1 minute"
description = """
One creature that you can see within range must make a Wisdom saving throw. On a successful save, the target dances comically until the end of its next turn, during which it must spend all its movement to dance in place.

On a failed save, the target has the [[glossary:Charmed]] condition for the duration. While [[glossary:Charmed]], the target dances comically, must use all its movement to dance in place, and has [[glossary:Disadvantage]] on Dexterity saving throws and attack rolls, and other creatures have [[glossary:Advantage]] on attack rolls against it. On each of its turns, the target can take an action to collect itself and repeat the save, ending the spell on itself on a success.
"""
source = "Player's Handbook, p. 303"
