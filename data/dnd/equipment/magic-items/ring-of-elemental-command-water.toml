description = """
The Ring of Elemental Command (water) is linked to the Elemental Plane of Water. Every Ring of Elemental Command has the following two properties:

 - **Elemental Bane.** While wearing the ring, you have [[glossary:Advantage]] on attack rolls against Elementals and they have [[glossary:Disadvantage]] on attack rolls against you.
 - **Elemental Compulsion.** While wearing the ring, you can take a [[glossary:Magic]] action to try to compel an Elemental you see within 60 feet of yourself. The Elemental makes a DC 18 Wisdom saving throw. On a failed save, the Elemental has the [[glossary:Charmed]] condition until the start your next turn, and you determine what it does with its move and action on its next turn.

**_Elemental Focus._** While wearing the ring, you benefit from additional properties corresponding to the ring's linked Elemental Plane:

 - **Water.** You know Aquan, you gain a [[glossary:Swim Speed]] of 60 feet, and you can breathe underwater.

**_Spellcasting._** The ring has 5 charges and regains 1d4 + 1 expended charges daily at dawn. While wearing the ring, you can cast a spell from it. A spell cast from the ring has a save DC of 18. Choose the spell from the following list: [[[spell:Create or Destroy Water]]] (1 charge), [[[spell:Ice Storm]]] (2 charges), [[[spell:Tsunami]]] (5 charges), [[[spell:Wall of Ice]]] (3 charges), [[[spell:Water Walk]]] (2 charges)
"""
