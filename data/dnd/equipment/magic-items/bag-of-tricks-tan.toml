source = "Dungeon Master's Guide, p. 234"
description = """
This bag made from tan cloth appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object.

You can take a [[glossary:Magic]] action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling on the table below. See the Monster Manual for the creature's stat block. The creature vanishes at the next dawn or when it is reduced to 0 [[glossary:Hit Points]].

The creature is [[glossary:Friendly]] to you and your allies, and it acts immediately after you on your [[glossary:Initiative]] count. You can take a [[glossary:Bonus Action]] to command how the creature moves and what action it takes on its next turn, such as attacking an enemy. In the absence of such orders, the creature acts in a fashion appropriate to its nature.

Once three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.

| 1d8 | Creature                     |
|-----|------------------------------|
| 1   | [[[monster:Jackal]]]       |
| 2   | [[[monster:Ape]]]          |
| 3   | [[[monster:Baboon]]]       |
| 4   | [[[monster:Axe Beak]]]     |
| 5   | [[[monster:Black Bear]]]   |
| 6   | [[[monster:Giant Weasel]]] |
| 7   | [[[monster:Giant Hyena]]]  |
| 8   | [[[monster:Tiger]]]        |
"""
