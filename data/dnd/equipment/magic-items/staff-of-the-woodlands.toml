attunement = true
classes = ["Druid"]
notes = ""
source = "Dungeon Master's Guide, p. 311"
description = """
This staff has 6 charges and can be wielded as a magic Quarterstaff that grants a +2 bonus to attack rolls and damage rolls made with it. While holding it, you have a +2 bonus to spell attack rolls.

**_Spells._** While holding the staff, you can cast one of the spells on the following table from it, using your spell save DC. The table indicates how many charges you must expend to cast the spell.

| Spell                                  | Charge Cost |
|----------------------------------------|-------------|
| [[[spell:Animal Friendship]]]        | 1           |
| [[[spell:Awaken]]]                   | 5           |
| [[[spell:Barkskin]]]                 | 2           |
| [[[spell:Locate Animals or Plants]]] | 2           |
| [[[spell:Pass without Trace]]]       | 2           |
| [[[spell:Speak with Animals]]]       | 1           |
| [[[spell:Speak with Plants]]]        | 3           |
| [[[spell:Wall of Thorns]]]           | 6           |

**_Tree Form._** You can take a [[glossary:Magic]] action to plant one end of the staff in earth in an unoccupied space and expend 1 charge to transform the staff into a healthy tree. The tree is 60 feet tall and has a 5-foot-diameter trunk, and its branches at the top spread out in a 20-foot radius. The tree appears ordinary but radiates a faint aura of Transmutation magic that can be discerned with the [[[spell:Detect Magic]]] spell. While touching the tree and using a [[glossary:Magic]] action, you return the staff to its normal form. Any creature in the tree falls when the tree reverts to a staff.

**_Regaining Charges._** The staff regains 1d6 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, the staff loses its properties and becomes a nonmagical Quarterstaff.
"""
