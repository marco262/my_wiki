title = "Hallucinatory Terrain"
spell_lists = ["Bard", "Druid", "Warlock", "Wizard"]
level = "4"
school = "Illusion"
concentration_spell = false
ritual_spell = false
casting_time = "10 minute"
range = "300 feet"
components = ["V", "S", "M"]
material = "a mushroom"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "24 hours"
description = """
You make natural terrain in a 150-foot [[glossary:Cube]] in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed.

The tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn't obvious by touch, a creature examining the illusion can take the [[glossary:Study]] action to make an Intelligence ([[tooltip:Investigation]]) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.
"""
source = "Player's Handbook, p. 283"
