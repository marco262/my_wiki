name = "Animated Shield"
type = "Armor"
subtype = "Shield"
rarity = "Very Rare"
tables = ["Armaments"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 229"
description = "While holding this Shield, you can take a [[glossary:Bonus Action]] to cause it to animate. The Shield leaps into the air and hovers in your space to protect you as if you were wielding it, leaving your hands free. The Shield remains animate for 1 minute, until you take a [[glossary:Bonus Action]] to end this effect, or until you die or have the [[glossary:Incapacitated]] condition, at which point the Shield falls to the ground or into your hand if you have one free."
