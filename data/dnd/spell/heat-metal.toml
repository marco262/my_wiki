title = "Heat Metal"
spell_lists = ["Bard", "Druid"]
level = "2"
school = "Transmutation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S", "M"]
material = "a piece of iron and a flame"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
Choose a manufactured metal object, such as a metal weapon or a suit of Heavy or Medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 Fire damage when you cast the spell. Until the spell ends, you can take a [[glossary:Bonus Action]] on each of your later turns to deal this damage again if the object is within range.

If a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a Constitution saving throw or drop the object if it can. If it doesn't drop the object, it has [[glossary:Disadvantage]] on attack rolls and ability checks until the start of your next turn.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 2."
source = "Player's Handbook, p. 284"
