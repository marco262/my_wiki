rarity = "Rare"
tables = ["Armaments"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 304"
description = """
While holding this Shield, you have [[glossary:Resistance]] to damage from attacks made with Ranged weapons.

**_Curse._** This Shield is cursed. Attuning to it curses you until you are targeted by a [[[spell:Remove Curse]]] spell or similar magic. Removing the Shield fails to end the curse on you. Whenever an attack with a Ranged weapon targets a creature within 10 feet of you, the curse causes you to become the target instead.
"""
