title = "Call Lightning"
spell_lists = ["Druid"]
level = "3"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S"]
duration = "10 minutes"
description = """
A storm cloud appears at a point within range that you can see above yourself. It takes the shape of a [[glossary:Cylinder]] that is 10 feet tall with a 60-foot radius.

When you cast the spell, choose a point you can see under the cloud. A lightning bolt shoots from the cloud to that point. Each creature within 5 feet of that point makes a Dexterity saving throw, taking 3d10 Lightning damage on a failed save or half as much damage on a successful one.

Until the spell ends, you can take a [[glossary:Magic]] action to call down lightning in that way again, targeting the same point or a different one.

If you're outdoors in a storm when you cast this spell, the spell gives you control over that storm instead of creating a new one. Under such conditions, the spell's damage increases by 1d10.
"""
at_higher_levels = "The damage increases by 1d10 for each spell slot level above 3."
source = "Player's Handbook, p. 248"
