title = "Geas"
spell_lists = ["Bard", "Cleric", "Druid", "Paladin", "Wizard"]
level = "5"
school = "Enchantment"
concentration_spell = false
ritual_spell = false
casting_time = "1 minute"
range = "60 feet"
components = ["V"]
duration = "30 days"
description = """
You give a verbal command to a creature that you can see within range, ordering it to carry out some service or refrain from an action or a course of activity as you decide. The target must succeed on a Wisdom saving throw or have the [[glossary:Charmed]] condition for the duration. The target automatically succeeds if it can't understand your command.

While [[glossary:Charmed]], the creature takes 5d10 Psychic damage if it acts in a manner directly counter to your command. It takes this damage no more than once each day.

You can issue any command you choose, short of an activity that would result in certain death. Should you issue a suicidal command, the spell ends.

A _[[[spell:Remove Curse]]]_, _[[[spell:Greater Restoration]]]_, or _[[[spell:Wish]]]_ spell ends this spell.
"""
at_higher_levels = "If you use a level 7 or 8 spell slot, the duration is 365 days. If you use a level 9 spell slot, the spell lasts until it is ended by one of the spells mentioned above."
source = "Player's Handbook, p. 278"
