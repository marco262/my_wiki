title = "Meld into Stone"
spell_lists = ["Cleric", "Druid", "Ranger"]
level = "3"
school = "Transmutation"
concentration_spell = false
ritual_spell = true
casting_time = "Action"
range = "Touch"
components = ["V", "S"]
duration = "8 hours"
description = """
You step into a stone object or surface large enough to fully contain your body, merging yourself and your equipment with the stone for the duration. You must touch the stone to do so. Nothing of your presence remains visible or otherwise detectable by nonmagical senses.

While merged with the stone, you can't see what occurs outside it, and any Wisdom ([[tooltip:Perception]]) checks you make to hear sounds outside it are made with [[glossary:Disadvantage]]. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use 5 feet of movement to leave the stone where you entered it, which ends the spell. You otherwise can't move.

Minor physical damage to the stone doesn't harm you, but its partial destruction or a change in its shape (to the extent that you no longer fit within it) expels you and deals 6d6 Force damage to you. The stone's complete destruction (or transmutation into a different substance) expels you and deals 50 Force damage to you. If expelled, you move into an unoccupied space closest to where you first entered and have the [[glossary:Prone]] condition.
"""
source = "Player's Handbook, p. 296"
