name = "Cauldron of Rebirth"
type = "Wondrous Item"
subtype = ""
rarity = "Very Rare"
tables = ["Arcana", "Relics"]
attunement = true
classes = ["Druid", "Warlock"]
notes = ""
source = "Dungeon Master's Guide, p. 243"
description = """
This Tiny pot bears relief scenes of heroes on its cast-iron sides.

You can use the cauldron as a [[glossary:Spellcasting Focus]] for your spells, and it functions as a suitable component for the [[[spell:Scrying]]] spell.

**_Brew Potion._** When you finish a [[glossary:Long Rest]], you can use the cauldron to create a [[tooltip:Potion of Greater Healing]], which takes 1 minute. The potion lasts for 24 hours, then loses its magic if not consumed.

**_Raise Dead._** As a [[glossary:Magic]] action, you can cause the cauldron to grow large enough for a Medium creature to crouch within. You can revert the cauldron to its normal size as a [[glossary:Magic]] action, harmlessly shunting anything that can't fit inside to the nearest unoccupied space.

If you place the corpse of a Humanoid into the cauldron and cover the corpse with 200 pounds of salt (which costs 10 GP) for at least 8 hours, the salt is consumed and the creature returns to life as if by [[[spell:Raise Dead]]] at the next dawn. Once used, this property can't be used again for 7 days.
"""
