title = "Heroes' Feast"
spell_lists = ["Bard", "Cleric", "Druid"]
level = "6"
school = "Conjuration"
concentration_spell = false
ritual_spell = false
casting_time = "10 minute"
range = "Self (10-foot [[glossary:cube]])"
components = ["V", "S", "M"]
material = "a gem-encrusted bowl worth 1,000+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 100000
