title = "Power Word Heal"
spell_lists = ["Bard", "Cleric"]
level = "9"
school = "Enchantment"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S"]
duration = "Instantaneous"
description = "A wave of healing energy washes over one creature you can see within range. The target regains all its [[glossary:Hit Points]]. If the creature has the [[glossary:Charmed]], [[glossary:Frightened]], [[glossary:Paralyzed]], [[glossary:Poisoned]], or [[glossary:Stunned]] condition, the condition ends. If the creature has the [[glossary:Prone]] condition, it can use its [[glossary:Reaction]] to stand up."
source = "Player's Handbook, p. 306"
