title = "Incendiary Cloud"
spell_lists = ["Druid", "Sorcerer", "Wizard"]
level = "8"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "150 feet"
components = ["V", "S"]
duration = "1 minute"
description = """
A swirling cloud of embers and smoke fills a 20-foot-radius [[glossary:Sphere]] centered on a point within range. The cloud's area is [[glossary:Heavily Obscured]]. It lasts for the duration or until a strong wind (like that created by _[[[spell:Gust of Wind]]]_) disperses it.

When the cloud appears, each creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failed save or half as much damage on a successful one. A creature must also make this save when the [[glossary:Sphere]] moves into its space and when it enters the [[glossary:Sphere]] or ends its turn there. A creature makes this save only once per turn.

The cloud moves 10 feet away from you in a direction you choose at the start of each of your turns.
"""
source = "Player's Handbook, p. 288"
