description = """
Brilliant sunlight flashes in a 60-foot-radius [[glossary:Sphere]] centered on a point you choose within range. Each creature in the [[glossary:Sphere]] makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the [[glossary:Blinded]] condition for 1 minute. On a successful save, it takes half as much damage only.

A creature [[glossary:Blinded]] by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success.

This spell dispels [[glossary:Darkness]] in its area that was created by any spell.
"""
source = "Player's Handbook, p. 329"
