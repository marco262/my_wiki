title = "Mind Spike"
spell_lists = ["Sorcerer", "Warlock", "Wizard"]
level = "2"
school = "Divination"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["S"]
duration = "1 hour"
description = "You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target's location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can't become hidden from you, and if it has the [[glossary:Invisible]] condition, it gains no benefit from that condition against you."
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 2."
source = "Player's Handbook, p. 298"
