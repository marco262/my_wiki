title = "Resurrection"
spell_lists = ["Bard", "Cleric"]
level = "7"
school = "Necromancy"
concentration_spell = false
ritual_spell = false
casting_time = "1 hour"
range = "Touch"
components = ["V", "S", "M"]
material = "a diamond worth 1,000+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 100000
material_component_consumed = true
duration = "Instantaneous"
description = """
With a touch, you revive a dead creature that has been dead for no more than a century, didn't die of old age, and wasn't Undead when it died.

The creature returns to life with all its [[glossary:Hit Points]]. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds and restores any missing body parts.

Coming back from the dead is an ordeal. The target takes a -4 penalty to [[glossary:D20 Test]]. Every time the target finishes a [[glossary:Long Rest]], the penalty is reduced by 1 until it becomes 0.

Casting this spell to revive a creature that has been dead for 365 days or longer taxes you. Until you finish a [[glossary:Long Rest]], you can't cast spells again, and you have [[glossary:Disadvantage]] on [[glossary:D20 Test]].
"""
source = "Player's Handbook, p. 312"
