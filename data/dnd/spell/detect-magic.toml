title = "Detect Magic"
spell_lists = ["Artificer", "Bard", "Cleric", "Druid", "Paladin", "Ranger", "Sorcerer", "Warlock", "Wizard"]
level = "1"
school = "Divination"
concentration_spell = true
ritual_spell = true
casting_time = "Action"
range = "Self (30-foot [[glossary:sphere]])"
components = ["V", "S"]
duration = "10 minutes"
description = """
For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the [[glossary:Magic]] action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's school of magic.

The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.
"""
source = "Player's Handbook, p. 262"
