title = "Reincarnate"
spell_lists = ["Druid"]
level = "5"
school = "Necromancy"
concentration_spell = false
ritual_spell = false
casting_time = "1 hour"
range = "Touch"
components = ["V", "S", "M"]
material = "rare oils worth 1,000+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 100000
material_component_consumed = true
duration = "Instantaneous"
description = """
You touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body's species, or the DM chooses another playable species.

| 1d10 | Species                 |
|------|-------------------------|
| 1    | [[[advancement:Races#Aasimar]]]    |
| 2    | [[[advancement:Races#Dragonborn]]] |
| 3    | [[[advancement:Races#Dwarf]]]      |
| 4    | [[[advancement:Races#Elf]]]        |
| 5    | [[[advancement:Races#Gnome]]]      |
| 6    | [[[advancement:Races#Goliath]]]    |
| 7    | [[[advancement:Races#Halfling]]]   |
| 8    | [[[advancement:Races#Human]]]      |
| 9    | [[[advancement:Races#Orc]]]        |
| 10   | [[[advancement:Races#Tiefling]]]   |

The reincarnated creature makes any choices that a species' description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.
"""
source = "Player's Handbook, p. 311"
