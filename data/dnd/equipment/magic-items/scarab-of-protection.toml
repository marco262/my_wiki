source = "Dungeon Master's Guide, p. 302"
description = """
This beetle-shaped medallion provides three benefits while it is on your person.

**_Defense._** You gain a +1 bonus to [[glossary:Armor Class]].

**_Preservation._** The scarab has 12 charges. If you fail a saving throw against a Necromancy spell or a harmful effect originating from an Undead, you can take a [[glossary:Reaction]] to expend 1 charge and turn the failed save into a successful one. The scarab crumbles into powder and is destroyed when its last charge is expended.

**_Spell Resistance._** You have [[glossary:Advantage]] on saving throws against spells.
"""
