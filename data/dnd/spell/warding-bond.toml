title = "Warding Bond"
spell_lists = ["Cleric", "Paladin"]
level = "2"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Touch"
components = ["V", "S", "M"]
material = "a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration"
expensive_material_component = true
material_component_cost = 5000
material_component_consumed = false
duration = "1 hour"
description = """
You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has [[glossary:Resistance]] to all damage. Also, each time it takes damage, you take the same amount of damage.

The spell ends if you drop to 0 [[glossary:Hit Points]] or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.
"""
source = "Player's Handbook, p. 340"
