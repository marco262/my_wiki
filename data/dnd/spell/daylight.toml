title = "Daylight"
spell_lists = ["Cleric", "Druid", "Paladin", "Ranger", "Sorcerer"]
level = "3"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S"]
duration = "1 hour"
description = """
For the duration, sunlight spreads from a point within range and fills a 60-foot-radius [[glossary:Sphere]]. The sunlight's area is [[glossary:Bright Light]] and sheds [[glossary:Dim Light]] for an additional 60 feet.

Alternatively, you cast the spell on an object that isn't being worn or carried, causing the sunlight to fill a 60-foot [[glossary:Emanation]] originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight.

If any of this spell's area overlaps with an area of [[glossary:Darkness]] created by a spell of level 3 or lower, that other spell is dispelled.
"""
source = "Player's Handbook, p. 260"
