title = "Hunter's Mark"
spell_lists = ["Ranger"]
level = "1"
school = "Divination"
concentration_spell = true
ritual_spell = false
casting_time = "Bonus Action"
range = "90 feet"
components = ["V"]
duration = "1 hour"
description = """
You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have [[glossary:Advantage]] on any Wisdom ([[tooltip:Perception]] or [[tooltip:Survival]]) check you make to find it.

If the target drops to 0 [[glossary:Hit Points]] before this spell ends, you can take a [[glossary:Bonus Action]] to move the mark to a new creature you can see within range.
"""
at_higher_levels = "Your [[glossary:Concentration]] can last longer with a spell slot of level 3-4 (up to 8 hours) or 5+ (up to 24 hours)."
source = "Player's Handbook, p. 287"
