title = "Death Ward"
spell_lists = ["Cleric", "Paladin"]
level = "4"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Touch"
components = ["V", "S"]
duration = "8 hours"
description = """
You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 [[glossary:Hit Points]] before the spell ends, the target instead drops to 1 [[glossary:Hit Points]], and the spell ends.

If the spell is still in effect when the target is subjected to an effect that would kill it instantly without dealing damage, that effect is negated against the target, and the spell ends.
"""
source = "Player's Handbook, p. 261"
