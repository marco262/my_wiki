source = "Dungeon Master's Guide, p. 271"
description = "While you are playing this [[tooltip:musical instrument]], you can take a [[glossary:Magic]] action to create harmless, illusory visual effects within a 5-foot [[glossary:Emanation]] originating from the instrument. If you are a Bard, the size of the [[glossary:Emanation]] increases to 15 feet. Sample visual effects include luminous musical notes, a spectral dancer, butterflies, and gently falling snow. The magical effects have neither substance nor sound, and they are obviously illusory. The effects end when you stop playing."
