source = "Dungeon Master's Guide, p. 312"
description = "While touching this 5-pound stone to the ground, you can take a [[glossary:Magic]] action to summon an [[[monster:Earth Elemental]]]. The elemental appears in an unoccupied space you choose within 30 feet of yourself, obeys your commands, and takes its turn immediately after you on your [[glossary:Initiative]] count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a [[glossary:Bonus Action]]. The stone can't be used this way again until the next dawn."
