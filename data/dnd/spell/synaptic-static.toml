title = "Synaptic Static"
spell_lists = ["Bard", "Sorcerer", "Warlock", "Wizard"]
level = "5"
school = "Enchantment"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S"]
duration = "Instantaneous"
description = """
You cause psychic energy to erupt at a point within range. Each creature in a 20-foot-radius [[glossary:Sphere]] centered on that point makes an Intelligence saving throw, taking 8d6 Psychic damage on a failed save or half as much damage on a successful one.

On a failed save, a target also has muddled thoughts for 1 minute. During that time, it subtracts 1d6 from all its attack rolls and ability checks, as well as any Constitution saving throws to maintain [[glossary:Concentration]]. The target makes an Intelligence saving throw at the end of each of its turns, ending the effect on itself on a success.
"""
source = "Player's Handbook, p. 330"
