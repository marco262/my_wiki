title = "Vampiric Touch"
spell_lists = ["Sorcerer", "Warlock", "Wizard"]
level = "3"
school = "Necromancy"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["V", "S"]
duration = "1 minute"
description = """
The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain [[glossary:Hit Points]] equal to half the amount of Necrotic damage dealt.

Until the spell ends, you can make the attack again on each of your turns as a [[glossary:Magic]] action, targeting the same creature or a different one.
"""
at_higher_levels = "The damage increases by 1d6 for each spell slot level above 3."
source = "Player's Handbook, p. 337"
