description = """
This cape smells faintly of brimstone. While wearing it, you can use it to cast [[[spell:Dimension Door]]] as a [[glossary:Magic]] action. This property can't be used again until the next dawn.

When you teleport with that spell, you leave behind a cloud of smoke. The space you left is [[glossary:Lightly Obscured]] by that smoke until the end of your next turn.
