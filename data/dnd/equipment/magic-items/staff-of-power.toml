source = "Dungeon Master's Guide, p. 308"
description = """
This staff has 20 charges and can be wielded as a magic Quarterstaff that grants a +2 bonus to attack rolls and damage rolls made with it. While holding it, you gain a +2 bonus to [[glossary:Armor Class]], saving throws, and spell attack rolls.

**_Spells._** While holding the staff , you can cast one of the spells on the following table from it, using your spell save DC. The table indicates how many charges you must expend to cast the spell.

| Spell                                          | Charge Cost |
|------------------------------------------------|-------------|
| [[[spell:Cone of Cold]]]                     | 5           |
| [[[spell:Fireball]]] (level 5 version)       | 5           |
| [[[spell:Globe of Invulnerability]]]         | 6           |
| [[[spell:Hold Monster]]]                     | 5           |
| [[[spell:Levitate]]]                         | 2           |
| [[[spell:Lightning Bolt]]] (level 5 version) | 5           |
| [[[spell:Magic Missile]]]                    | 1           |
| [[[spell:Ray of Enfeeblement]]]              | 1           |
| [[[spell:Wall of Force]]]                    | 5           |

**_Regaining Charges._** The staff regains 2d8 + 4 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, the staff retains its +2 bonus to attack rolls and damage rolls but loses all other properties. On a 20, the staff regains 1d8 + 2 charges.

**_Retributive Strike._** You can take a [[glossary:Magic]] action to break the staff over your knee or against a solid surface. The staff is destroyed and releases its magic in an explosion that fills a 30-foot [[glossary:Emanation]] originating from itself. You have a {@chance 50} chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take Force damage equal to 16 times the number of charges in the staff. Each other creature in the area makes a DC 17 Dexterity saving throw. On a failed save, a creature takes Force damage equal to 4 times the number of charges in the staff. On a successful save, a creature takes half as much damage.
"""
