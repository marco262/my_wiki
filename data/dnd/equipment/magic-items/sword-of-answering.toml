description = "You gain a +3 bonus to attack rolls and damage rolls made with this sword. In addition, while you hold the sword, you can take a [[glossary:Reaction]] to make one melee attack with it against any creature in your reach that deals damage to you. You have [[glossary:Advantage]] on the attack roll, and any damage dealt with this special attack ignores any [[glossary:Immunity]] or [[glossary:Resistance]] the target has to that damage."
