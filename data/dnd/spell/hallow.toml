title = "Hallow"
spell_lists = ["Cleric"]
level = "5"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "24 hour"
range = "Touch"
components = ["V", "S", "M"]
material = "incense worth 1,000+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 100000
material_component_consumed = true
duration = "Until dispelled"
description = """
You touch a point and infuse an area around it with holy or unholy power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect of Hallow. The affected area has the following effects.

**_Hallowed Ward._** Choose any of these creature types: Aberration, Celestial, Elemental, Fey, Fiend, or Undead. Creatures of the chosen types can't willingly enter the area, and any creature that is possessed by or that has the [[glossary:Charmed]] or [[glossary:Frightened]] condition from such creatures isn't possessed, [[glossary:Charmed]], or [[glossary:Frightened]] by them while in the area.

**_Extra Effect._** You bind an extra effect to the area from the list below:

 - **Courage** Creatures of any types you choose can't gain the [[glossary:Frightened]] condition while in the area.
 - **Darkness** [[glossary:Darkness]] fills the area. Normal light, as well as magical light created by spells of a level lower than this spell, can't illuminate the area.
 - **Daylight** Bright light fills the area. Magical [[glossary:Darkness]] created by spells of a level lower than this spell can't extinguish the light.
 - **Peaceful Rest** [[glossary:Dead]] bodies interred in the area can't be turned into Undead.
 - **Extradimensional Interference** Creatures of any types you choose can't enter or exit the area using teleportation or interplanar travel.
 - **Fear** Creatures of any types you choose have the [[glossary:Frightened]] condition while in the area.
 - **Resistance** Creatures of any types you choose have [[glossary:Resistance]] to one damage type of your choice while in the area.
 - **Silence** No sound can emanate from within the area, and no sound can reach into it.
 - **Tongues** Creatures of any types you choose can communicate with any other creature in the area even if they don't share a common language.
 - **Vulnerability** Creatures of any types you choose have [[glossary:Vulnerability]] to one damage type of your choice while in the area.
"""
source = "Player's Handbook, p. 283"
