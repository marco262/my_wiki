duration = "1 hour"
description = """
You touch a willing creature and put it into a cataleptic state that is indistinguishable from death.

For the duration, the target appears dead to outward inspection and to spells used to determine the target's status. The target has the [[glossary:Blinded]] and [[glossary:Incapacitated]] conditions, and its [[glossary:Speed]] is 0.

The target also has [[glossary:Resistance]] to all damage except Psychic damage, and it has [[glossary:Immunity]] to the [[glossary:Poisoned]] condition.
"""
source = "Player's Handbook, p. 271"
