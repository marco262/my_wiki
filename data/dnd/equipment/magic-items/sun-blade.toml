source = "Dungeon Master's Guide, p. 312"
description = """
This item appears to be a sword hilt.

**_Blade of Radiance._** While grasping the hilt, you can take a [[glossary:Bonus Action]] to cause a blade of pure radiance to spring into existence or make the blade disappear. While the blade exists, this magic weapon functions as a Longsword with {@itemProperty F|XPHB|Finesse}. If you are proficient with Longswords or Shortswords, you are proficient with the Sun Blade.

You gain a +2 bonus to attack rolls and damage rolls made with this weapon, which deals Radiant damage instead of Slashing damage. When you hit an Undead with it, that target takes an extra 1d8 Radiant damage.

**_Sunlight._** The sword's luminous blade emits [[glossary:Bright Light]] in a 15-foot radius and [[glossary:Dim Light]] for an additional 15 feet. The light is sunlight. While the blade persists, you can take a [[glossary:Magic]] action to expand or reduce its radius of [[glossary:Bright Light]] and [[glossary:Dim Light]] by 5 feet each, to a maximum of 30 feet each or a minimum of 10 feet each.
"""
