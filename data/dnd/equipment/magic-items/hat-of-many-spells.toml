name = "Hat of Many Spells"
type = "Wondrous Item"
subtype = ""
rarity = "Very Rare"
tables = ["Arcana"]
attunement = true
classes = ["Wizard"]
notes = ""
source = "Dungeon Master's Guide, p. 266"
description = """
This pointed hat has the following properties.

**_Spellcasting Focus._** While holding the hat, you can use it as a [[glossary:Spellcasting Focus]] for your Wizard spells. Any spell you cast using the hat gains a special Somatic component: you must reach into the hat and "pull" the spell out of it.

**_Unknown Spell._** While holding the hat, you can try to cast a level 1+ spell you don't know. The spell must be on the Wizard spell list, it must be of a level you can cast, and it can't have Material components costing more than 1,000 GP. Once you decide on the spell, you must expend a spell slot of the spell's level. Then, to determine whether you cast the spell, make an Intelligence ([[tooltip:Arcana]]) check (DC 10 plus the spell's level). On a successful check, you cast the spell using its normal casting time, and you can't use this property again until you finish a [[glossary:Short Rest]] or [[glossary:Long Rest]]. On a failed check, you fail to cast the spell and a random effect occurs instead, determined by rolling on the following table.

Any spell you cast from the hat uses your spell save DC and spell attack bonus.

| 1d100 | Effect                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          |
|-------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
| 01-50 | You cast a random spell determined by rolling 1d10: on a **1**, [[[spell:Enlarge/Reduce]]] (enlarge effect); on a **2**, [[[spell:Enlarge/Reduce]]] (reduce effect); on a **3**, [[[spell:Faerie Fire]]]; on a **4**, [[[spell:Fireball]]]; on a **5**, [[[spell:Gust of Wind]]]; on a **6**, [[[spell:Invisibility]]] (cast on yourself); on a **7**, [[[spell:Lightning Bolt]]]; on an **8**, [[[spell:Phantasmal Force]]]; on a **9**, [[[spell:Polymorph]]]; on a **10**, [[[spell:Stinking Cloud]]]. |
| 51-55 | You have the [[glossary:Stunned]] condition until the end of your next turn, believing something awesome just happened.                                                                                                                                                                                                                                                                                                                                                                                                                    |
| 56-60 | A harmless swarm of butterflies fills a 10-foot [[glossary:Cube]] within 30 feet of yourself. The swarm disperses after 1 minute.                                                                                                                                                                                                                                                                                                                                                                                  |
| 61-65 | You pull a nonmagical object out of the hat. Roll 1d4 to determine the object: on a **1**, a vial of Acid; on a **2**, a flask of Alchemist's Fire; on a **3**, a Crowbar; on a **4**, a lit Torch.                                                                                                                                                                                                                                                                                                                                 |
| 66-70 | You suffer a bout of "magic sickness" and have the [[glossary:Poisoned]] condition for 1 hour.                                                                                                                                                                                                                                                                                                                                                                                                                                             |
| 71-75 | You have the [[glossary:Petrified]] condition until the end of your next turn.                                                                                                                                                                                                                                                                                                                                                                                                                                                             |
| 76-80 | You pull a nonmagical object out of the hat. Roll 1d4 to determine the object: on a **1**, a [[tooltip:Dagger]]; on a **2**, a [[tooltip:Rope]] with a [[tooltip:Grappling Hook]] tied to one end; on a **3**, a bag of [[tooltip:Caltrops]]; on a **4**, a gem worth 50 GP.                                                                                                                                                                                                                                                    |
| 81-85 | A creature appears in an unoccupied space as close to you as possible. The creature isn't under your control and acts as it normally would, and it disappears after 1 hour or when it drops to 0 [[glossary:Hit Points]]. Roll 1d4 to determine the creature: on a **1**, a [[[monster:Camel]]]; on a **2**, a [[[monster:Constrictor Snake]]]; on a **3**, an [[[monster:Elephant]]]; on a **4**, a [[[monster:Mule]]].                                                                                             |
| 86-90 | A [[glossary:Hostile]] [[[monster:Swarm of Bats]]] flies out of the hat, occupies your space, and attacks you.                                                                                                                                                                                                                                                                                                                                                                                                      |
| 91-95 | A vertical, 10-foot-diameter, two-way portal to another plane of existence opens in an unoccupied space within 30 feet of you and remains open until the end of your next turn. The DM determines where it leads.                                                                                                                                                                                                                                                                                                                               |
| 96-00 | You pull a magic item out of the hat. Roll 1d6 to determine the item's rarity: on a **1-3**, Common; on a **4-5**, Uncommon; on a **6**, Rare. The DM chooses the item, which disappears after 1 hour if it's not consumed or destroyed before then.                                                                                                                                                                                       |
"""
