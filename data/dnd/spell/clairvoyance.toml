components = ["V", "S", "M"]
material = "a focus worth 100+ GP, either a jeweled horn for hearing or a glass eye for seeing"
expensive_material_component = true
material_component_cost = 10000
material_component_consumed = false
duration = "10 minutes"
description = """
You create an [[glossary:Invisible]] sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The intangible, invulnerable sensor remains in place for the duration.

When you cast the spell, choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As a [[glossary:Bonus Action]], you can switch between seeing and hearing.

A creature that sees the sensor (such as a creature benefiting from _[[[spell:See Invisibility]]]_ or [[glossary:Truesight]]) sees a luminous orb about the size of your fist.
"""
source = "Player's Handbook, p. 250"
