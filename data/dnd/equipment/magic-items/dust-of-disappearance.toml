name = "Dust of Disappearance"
type = "Wondrous Item"
subtype = ""
rarity = "Uncommon"
tables = ["Arcana", "Implements"]
attunement = false
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 255"
description = "This powder resembles fine sand. There is enough of it for one use. When you take a [[glossary:Utilize]] action to throw the dust into the air, you and each creature and object within a 10-foot [[glossary:Emanation]] originating from you have the [[glossary:Invisible]] condition for 2d4 minutes. The duration is the same for all subjects, and the dust is consumed when its magic takes effect. Immediately after an affected creature makes an attack roll, deals damage, or casts a spell, the [[glossary:Invisible]] condition ends for that creature."
