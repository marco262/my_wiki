title = "Searing Smite"
spell_lists = ["Paladin"]
level = "1"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Bonus Action, which you take immediately after hitting a target with a Melee weapon or an [[glossary:Unarmed Strike]]"
range = "Self"
components = ["V"]
duration = "1 minute"
description = "As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends."
at_higher_levels = "All the damage increases by 1d6 for each spell slot level above 1."
source = "Player's Handbook, p. 314"
