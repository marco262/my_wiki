description = "This tiny vial contains magic perfume, enough for one use. You can take a [[glossary:Magic]] action to apply the perfume to yourself, and its effect lasts 1 hour. For the duration, you have [[glossary:Advantage]] on all Charisma ([[tooltip:Deception]] and [[tooltip:Persuasion]]) checks made to influence a creature within 5 feet of yourself."
