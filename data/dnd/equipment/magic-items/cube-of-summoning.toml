source = "Dungeon Master's Guide, p. 247"
description = """
This Tiny cube looks like a jack-in-the-box. When you wind its crank as a [[glossary:Magic]] action, a merry tune emits from the box, the lid pops open, a creature appears in the nearest unoccupied space, and the lid closes. The lid can't otherwise be opened.

Roll on the [[tooltip:Cube of Summoning]] table to determine which spell the cube casts to summon the creature. The spell is cast at level 5 (save DC 17, +9 attack bonus) and doesn't require [[glossary:Concentration]], but you otherwise function as the spell's caster.

Once the cube summons a creature, the cube can't do so again until the next dawn.

**Cube of Summoning**

| 1d6 | Spell                           |
|-----|---------------------------------|
| 1   | [[[spell:Summon Aberration]]] |
| 2   | [[[spell:Summon Beast]]]      |
| 3   | [[[spell:Summon Construct]]]  |
| 4   | [[[spell:Summon Dragon]]]     |
| 5   | [[[spell:Summon Elemental]]]  |
| 6   | [[[spell:Summon Fey]]]        |
"""
