title = "Mislead"
spell_lists = ["Bard", "Warlock", "Wizard"]
level = "5"
school = "Illusion"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["S"]
duration = "1 hour"
description = """
You gain the [[glossary:Invisible]] condition at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends immediately after you make an attack roll, deal damage, or cast a spell.

As a [[glossary:Magic]] action, you can move the illusory double up to twice your [[glossary:Speed]] and make it gesture, speak, and behave in whatever way you choose. It is intangible and invulnerable.

You can see through its eyes and hear through its ears as if you were located where it is.
"""
source = "Player's Handbook, p. 299"
