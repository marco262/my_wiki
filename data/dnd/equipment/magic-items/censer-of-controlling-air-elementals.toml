source = "Dungeon Master's Guide, p. 243"
description = "While gently swinging this censer, you can take a [[glossary:Magic]] action to summon an [[[monster:Air Elemental]]]. The elemental appears in an unoccupied space as close to the censer as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your [[glossary:Initiative]] count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a [[glossary:Bonus Action]]. The censer can't be used this way again until the next dawn."
