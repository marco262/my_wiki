title = "Storm of Vengeance"
spell_lists = ["Druid"]
level = "9"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "1 miles"
components = ["V", "S"]
duration = "1 minute"
description = """
A churning storm cloud forms for the duration, centered on a point within range and spreading to a radius of 300 feet. Each creature under the cloud when it appears must succeed on a Constitution saving throw or take 2d6 Thunder damage and have the [[glossary:Deafened]] condition for the duration.

At the start of each of your later turns, the storm produces different effects, as detailed below.

**_Turn 2._** Acidic rain falls. Each creature and object under the cloud takes 4d6 Acid damage.

**_Turn 3._** You call six bolts of lightning from the cloud to strike six different creatures or objects beneath it. Each target makes a Dexterity saving throw, taking 10d6 Lightning damage on a failed save or half as much damage on a successful one.

**_Turn 4._** Hailstones rain down. Each creature under the cloud takes 2d6 Bludgeoning damage.

**_Turns 5-10._** Gusts and freezing rain assail the area under the cloud. Each creature there takes 1d6 Cold damage. Until the spell ends, the area is [[glossary:Difficult Terrain]] and [[glossary:Heavily Obscured]], ranged attacks with weapons are impossible there, and strong wind blows through the area.
"""
source = "Player's Handbook, p. 321"
