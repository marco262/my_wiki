name = "Wand of Lightning Bolts"
type = "Wand"
subtype = ""
rarity = "Rare"
tables = ["Arcana"]
attunement = true
classes = ["spellcaster"]
notes = ""
source = "Dungeon Master's Guide, p. 320"
description = """
This wand has 7 charges. While holding it, you can expend no more than 3 charges to cast [[[spell:Lightning Bolt]]] (save DC 15) from it. For 1 charge, you cast the level 3 version of the spell. You can increase the spell's level by 1 for each additional charge you expend.

**_Regaining Charges._** The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed.
"""
