title = "Disintegrate"
spell_lists = ["Sorcerer", "Wizard"]
level = "6"
school = "Transmutation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S", "M"]
material = "a lodestone and dust"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "Instantaneous"
description = """
You launch a green ray at a target you can see within range. The target can be a creature, a nonmagical object, or a creation of magical force, such as the wall created by [[[spell:Wall of Force]]].

A creature targeted by this spell makes a Dexterity saving throw. On a failed save, the target takes 10d6 + 40 Force damage. If this damage reduces it to 0 [[glossary:Hit Points]], it and everything nonmagical it is wearing and carrying are disintegrated into gray dust. The target can be revived only by a [[[spell:True Resurrection]]] or a [[[spell:Wish]]] spell.

This spell automatically disintegrates a Large or smaller nonmagical object or a creation of magical force. If such a target is Huge or larger, this spell disintegrates a 10-foot-[[glossary:Cube]] portion of it.
"""
at_higher_levels = "The damage increases by 3d6 for each spell slot level above 6."
source = "Player's Handbook, p. 263"
