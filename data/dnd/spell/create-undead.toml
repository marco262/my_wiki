title = "Create Undead"
spell_lists = ["Cleric", "Warlock", "Wizard"]
level = "6"
school = "Necromancy"
concentration_spell = false
ritual_spell = false
casting_time = "1 minute"
range = "10 feet"
components = ["V", "S", "M"]
material = "one 150+ GP black onyx stone for each corpse"
expensive_material_component = true
material_component_cost = 15000
material_component_consumed = false
duration = "Instantaneous"
description = """
You can cast this spell only at night. Choose up to three corpses of Medium or Small Humanoids within range. Each one becomes a [[[monster:Ghoul]]] under your control (see the Monster Manual for its stat block).

As a [[glossary:Bonus Action]] on each of your turns, you can mentally command any creature you animated with this spell if the creature is within 120 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to them). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a particular place. If you issue no commands, the creature takes the [[glossary:Dodge]] action and moves only to avoid harm. Once given an order, the creature continues to follow the order until its task is complete.

The creature is under your control for 24 hours, after which it stops obeying any command you've given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature before the current 24-hour period ends. This use of the spell reasserts your control over up to three creatures you have animated with this spell rather than animating new ones.
"""
at_higher_levels = "If you use a level 7 spell slot, you can animate or reassert control over four [[[monster:Ghoul]]]. If you use a level 8 spell slot, you can animate or reassert control over five [[[monster:Ghoul]]] or two [[[monster:Ghast]]] or [[[monster:Wight]]]. If you use a level 9 spell slot, you can animate or reassert control over six [[[monster:Ghoul]]], three [[[monster:Ghast]]] or [[[monster:Wight]]], or two [[[monster:Mummy]]]. See the Monster Manual for these stat blocks."
source = "Player's Handbook, p. 258"
