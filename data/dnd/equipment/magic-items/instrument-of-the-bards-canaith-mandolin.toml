source = "Dungeon Master's Guide, p. 272"
description = """
An Instrument of the Bards is superior to an ordinary instrument in every way. Seven types of these instruments exist, each named after a bard college. A creature that attempts to play the instrument without being attuned to it must succeed on a DC 15 Wisdom saving throw or take 2d4 Psychic damage.

You can play the Canaith Mandolin to cast one of the following spells: [[[spell:Fly]]], [[[spell:Invisibility]]], [[[spell:Levitate]]], [[[spell:Protection from Evil and Good]]], [[[spell:Cure Wounds]]] (level 3), [[[spell:Dispel Magic]]], and [[[spell:Protection from Energy]]] (Lightning damage only). Once the Canaith Mandolin has been used to cast a spell, it can't be used to cast that spell again until the next dawn. The spells use your spellcasting ability and spell save DC.
"""
