source = "Dungeon Master's Guide, p. 276"
description = "This magic weapon has 3 charges and regains 1d3 expended charges daily at dawn. While holding the weapon, you can take a [[glossary:Magic]] action and expend 1 charge to release a wave of terror from it. Each creature of your choice within 30 feet of you must succeed on a DC 15 Wisdom saving throw or have the [[glossary:Frightened]] condition for 1 minute. While [[glossary:Frightened]] in this way, a creature must spend its turns trying to move as far away from you as it can, and it can't make [[glossary:Opportunity Attacks|Opportunity Attack]]. For its action, it can use only the [[glossary:Dash]] action or try to escape from an effect that prevents it from moving. If it has nowhere it can move, the creature can take the [[glossary:Dodge]] action. At the end of each of its turns, a creature repeats the save, ending the effect on itself on a success."
