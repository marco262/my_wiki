source = "Dungeon Master's Guide, p. 297"
description = "This robe has 3 charges, and it regains 1d3 expended charges daily at dawn. While you wear it, you can take a [[glossary:Magic]] action and expend 1 charge to cause the garment to display a shifting pattern of dazzling hues until the end of your next turn. During this time, the robe sheds [[glossary:Bright Light]] in a 30-foot radius and [[glossary:Dim Light]] for an additional 30 feet, and creatures that can see you have [[glossary:Disadvantage]] on attack rolls against you. Any creature in the [[glossary:Bright Light]] that can see you when the robe's power is activated must succeed on a DC 15 Wisdom saving throw or have the [[glossary:Stunned]] condition until the effect ends."
