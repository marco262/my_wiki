title = "Shining Smite"
spell_lists = ["Paladin"]
level = "2"
school = "Transmutation"
concentration_spell = true
ritual_spell = false
casting_time = "Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an [[glossary:Unarmed Strike]]"
range = "Self"
components = ["V"]
duration = "1 minute"
description = "The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds [[glossary:Bright Light]] in a 5-foot radius, attack rolls against it have [[glossary:Advantage]], and it can't benefit from the [[glossary:Invisible]] condition."
at_higher_levels = "The damage increases by 1d6 for each spell slot level above 2."
source = "Player's Handbook, p. 316"
