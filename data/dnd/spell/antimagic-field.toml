title = "Antimagic Field"
spell_lists = ["Cleric", "Wizard"]
level = "8"
school = "Abjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (10-foot [[glossary:emanation]])"
components = ["V", "S", "M"]
material = "iron filings"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 hour"
description = """
An aura of antimagic surrounds you in 10-foot [[glossary:Emanation]]. No one can cast spells, take [[glossary:Magic]] actions, or create other magical effects inside the aura, and those things can't target or otherwise affect anything inside it. Magical properties of magic items don't work inside the aura or on anything inside it.

Areas of effect created by spells or other magic can't extend into the aura, and no one can teleport into or out of it or use planar travel there. Portals close temporarily while in the aura.

Ongoing spells, except those cast by an Artifact or a deity, are suppressed in the area. While an effect is suppressed, it doesn't function, but the time it spends suppressed counts against its duration.

[[[spell:Dispel Magic]]] has no effect on the aura, and the auras created by different [[[spell:Antimagic Field]]] spells don't nullify each other.
"""
source = "Player's Handbook, p. 241"
