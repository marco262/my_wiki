source = "Eberron: Forge of the Artificer, p. 112"
description = """
This magic weapon grants a +1 bonus to attack and damage rolls made with it. While holding it, you can take a [[glossary:Bonus Action]] to cause it to shed [[glossary:Bright Light]] in a 30-foot radius and [[glossary:Dim Light]] for an additional 30 feet. You can extinguish the light as a [[glossary:Bonus Action]].

The weapon has 4 charges. You can take a [[glossary:Reaction]] immediately after being hit by an attack roll to expend 1 of the weapon's charges and force the attacker to make a DC 15 Constitution saving throw. On a failed save, the attacker has the [[glossary:Blinded]] condition until the end of its next turn. The weapon regains 1d4 expended charges daily at dawn.
"""
