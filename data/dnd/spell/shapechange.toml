title = "Shapechange"
spell_lists = ["Druid", "Wizard"]
level = "9"
school = "Transmutation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["V", "S", "M"]
material = "a jade circlet worth 1,500+ GP"
expensive_material_component = true
material_component_cost = 150000
material_component_consumed = false
duration = "1 hour"
description = """
You shape-shift into another creature for the duration or until you take a [[glossary:Magic]] action to shape-shift into a different eligible form. The new form must be of a creature that has a [[glossary:Challenge Rating]] no higher than your level or [[glossary:Challenge Rating]]. You must have seen the sort of creature before, and it can't be a Construct or an Undead.

When you cast the spell, you gain a number of [[glossary:Temporary Hit Points]] equal to the [[glossary:Hit Points]] of the first form into which you shape-shift. These [[glossary:Temporary Hit Points]] vanish if any remain when the spell ends.

Your game statistics are replaced by the stat block of the chosen form, but you retain your creature type; alignment; personality; Intelligence, Wisdom, and Charisma scores; [[glossary:Hit Points]]; [[glossary:Hit Point Dice]]; proficiencies; and ability to communicate. If you have the Spellcasting feature, you retain it too.

Upon shape-shifting, you determine whether your equipment drops to the ground or changes in size and shape to fit the new form while you're in it.
"""
source = "Player's Handbook, p. 315"
