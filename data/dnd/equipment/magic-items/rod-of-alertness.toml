source = "Dungeon Master's Guide, p. 299"
description = """
This rod has the following properties.

**_Alertness._** While holding the rod, you have [[glossary:Advantage]] on Wisdom ([[tooltip:Perception]]) checks and on [[glossary:Initiative]] rolls. Spells. While holding the rod, you can cast the following spells from it:

 - [[[spell:Detect Evil and Good]]]
 - [[[spell:Detect Magic]]]
 - [[[spell:Detect Poison and Disease]]]
 - [[[spell:See Invisibility]]]

**_Protective Aura._** As a [[glossary:Magic]] action, you can plant the haft end of the rod in the ground, whereupon the rod's head sheds [[glossary:Bright Light]] in a 60-foot radius and [[glossary:Dim Light]] for an additional 60 feet. While in that [[glossary:Bright Light]], you and your allies gain a +1 bonus to [[glossary:Armor Class]] and saving throws and can sense the location of any [[glossary:Invisible]] creature that is also in the [[glossary:Bright Light]].

The rod's head stops glowing and the effect ends after 10 minutes or when a creature takes a [[glossary:Magic]] action to pull the rod from the ground. Once used, this property can't be used again until the next dawn.
"""
