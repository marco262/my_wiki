components = ["V", "S", "M"]
material = "a piece of cork"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 hour"
description = """
This spell grants the ability to move across any liquid surface -- such as water, acid, mud, snow, quicksand, or lava -- as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration.

An affected target must take a [[glossary:Bonus Action]] to pass from the liquid's surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.
"""
source = "Player's Handbook, p. 340"
