title = "Power Word Stun"
spell_lists = ["Bard", "Sorcerer", "Warlock", "Wizard"]
level = "8"
school = "Enchantment"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V"]
duration = "Instantaneous"
description = """
You overwhelm the mind of one creature you can see within range. If the target has 150 [[glossary:Hit Points]] or fewer, it has the [[glossary:Stunned]] condition. Otherwise, its [[glossary:Speed]] is 0 until the start of your next turn.

The [[glossary:Stunned]] target makes a Constitution saving throw at the end of each of its turns, ending the condition on itself on a success.
"""
source = "Player's Handbook, p. 306"
