title = "Thunderous Smite"
spell_lists = ["Paladin"]
level = "1"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Bonus Action, which you take immediately after hitting a target with a Melee weapon or an [[glossary:Unarmed Strike]]"
range = "Self"
components = ["V"]
duration = "Instantaneous"
description = "Your strike rings with thunder that is audible within 300 feet of you, and the target takes an extra 2d6 Thunder damage from the attack. Additionally, if the target is a creature, it must succeed on a Strength saving throw or be pushed 10 feet away from you and have the [[glossary:Prone]] condition."
at_higher_levels = "The damage increases by 1d6 for each spell slot level above 1."
source = "Player's Handbook, p. 334"
