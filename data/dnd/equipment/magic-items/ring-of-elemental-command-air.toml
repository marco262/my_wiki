source = "Dungeon Master's Guide, p. 292"
description = """
The Ring of Elemental Command (air) is linked to the Elemental Plane of Air. Every Ring of Elemental Command has the following two properties:

 - **Elemental Bane.** While wearing the ring, you have [[glossary:Advantage]] on attack rolls against Elementals and they have [[glossary:Disadvantage]] on attack rolls against you.
 - **Elemental Compulsion.** While wearing the ring, you can take a [[glossary:Magic]] action to try to compel an Elemental you see within 60 feet of yourself. The Elemental makes a DC 18 Wisdom saving throw. On a failed save, the Elemental has the [[glossary:Charmed]] condition until the start your next turn, and you determine what it does with its move and action on its next turn.

**_Elemental Focus._** While wearing the ring, you benefit from additional properties corresponding to the ring's linked Elemental Plane:

 - **Air.** You know Auran, you have [[glossary:Resistance]] to Lightning damage, and you have a [[glossary:Fly Speed]] equal to your [[glossary:Speed]] and can hover.

**_Spellcasting._** The ring has 5 charges and regains 1d4 + 1 expended charges daily at dawn. While wearing the ring, you can cast a spell from it. A spell cast from the ring has a save DC of 18. Choose the spell from the following list: [[[spell:Chain Lightning]]] (3 charges), [[[spell:Feather Fall]]] (0 charges), [[[spell:Gust of Wind]]] (2 charges), [[[spell:Wind Wall]]] (1 charge)
"""
