title = "Conjure Elemental"
spell_lists = ["Druid", "Wizard"]
level = "5"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S"]
duration = "10 minutes"
description = """
You conjure a Large, intangible spirit from the Elemental Planes that appears in an unoccupied space within range. Choose the spirit's element, which determines its damage type: air (Lightning), earth (Thunder), fire (Fire), or water (Cold). The spirit lasts for the duration.

Whenever a creature you can see enters the spirit's space or starts its turn within 5 feet of the spirit, you can force that creature to make a Dexterity saving throw if the spirit has no creature [[glossary:Restrained]]. On failed save, the target takes 8d8 damage of the spirit's type, and the target has the [[glossary:Restrained]] condition until the spell ends. At the start of each of its turns, the [[glossary:Restrained]] target repeats the save. On a failed save, the target takes 4d8 damage of the spirit's type. On a successful save, the target isn't [[glossary:Restrained]] by the spirit.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 5."
source = "Player's Handbook, p. 254"
