description = """
The Ring of Elemental Command (earth) is linked to the Elemental Plane of Earth. Every Ring of Elemental Command has the following two properties:

 - **Elemental Bane.** While wearing the ring, you have [[glossary:Advantage]] on attack rolls against Elementals and they have [[glossary:Disadvantage]] on attack rolls against you.
 - **Elemental Compulsion.** While wearing the ring, you can take a [[glossary:Magic]] action to try to compel an Elemental you see within 60 feet of yourself. The Elemental makes a DC 18 Wisdom saving throw. On a failed save, the Elemental has the [[glossary:Charmed]] condition until the start your next turn, and you determine what it does with its move and action on its next turn.

**_Elemental Focus._** While wearing the ring, you benefit from additional properties corresponding to the ring's linked Elemental Plane:

 - **Earth.** You know Terran, and you have [[glossary:Resistance]] to Acid damage. Terrain composed of rubble, rocks, or dirt isn't [[glossary:Difficult Terrain]] for you. In addition, you can move through solid earth or rock as if those areas were [[glossary:Difficult Terrain]] without disturbing the matter through which you pass. If you end your turn in solid earth or rock, you are shunted out to the nearest unoccupied space you last occupied.

**_Spellcasting._** The ring has 5 charges and regains 1d4 + 1 expended charges daily at dawn. While wearing the ring, you can cast a spell from it. A spell cast from the ring has a save DC of 18. Choose the spell from the following list: [[[spell:Earthquake]]] (5 charges), [[[spell:Stone Shape]]] (2 charges), [[[spell:Stoneskin]]] (3 charges), [[[spell:Wall of Stone]]] (3 charges)
"""
