title = "Fire Storm"
spell_lists = ["Cleric", "Druid", "Sorcerer"]
level = "7"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "150 feet"
components = ["V", "S"]
duration = "Instantaneous"
description = """
A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each [[glossary:Cube]] must be contiguous with at least one other [[glossary:Cube]]. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one.

Flammable objects in the area that aren't being worn or carried start [[glossary:burning]].
"""
source = "Player's Handbook, p. 275"
