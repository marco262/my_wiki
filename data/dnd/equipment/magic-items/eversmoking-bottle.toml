name = "Eversmoking Bottle"
type = "Wondrous Item"
subtype = ""
rarity = "Uncommon"
tables = ["Arcana"]
attunement = false
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 259"
description = """
As a [[glossary:Magic]] action, you can open or close this bottle.

Opening the bottle causes thick smoke to billow out, forming a cloud that fills a 60-foot [[glossary:Emanation]] originating from the bottle. The area within the smoke is [[glossary:Heavily Obscured]].

Each minute the bottle remains open, the size of the [[glossary:Emanation]] increases by 10 feet until it reaches its maximum size of 120 feet.

Closing the bottle causes the cloud to become fixed in place until it disperses after 10 minutes. A strong wind (such as that created by the [[[spell:Gust of Wind]]] spell) disperses the cloud after 1 minute.
"""
