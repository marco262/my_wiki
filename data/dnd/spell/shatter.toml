A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius [[glossary:Sphere]] centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has [[glossary:Disadvantage]] on the save.

