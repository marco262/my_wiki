title = "Fount of Moonlight"
spell_lists = ["Bard", "Druid"]
level = "4"
school = "Evocation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["V", "S"]
duration = "10 minutes"
description = """
A cool light wreathes your body for the duration, emitting [[glossary:Bright Light]] in a 20-foot radius and [[glossary:Dim Light]] for an additional 20 feet.

Until the spell ends, you have [[glossary:Resistance]] to Radiant damage, and your melee attacks deal an extra 2d6 Radiant damage on a hit.

In addition, immediately after you take damage from a creature you can see within 60 feet of yourself, you can take a [[glossary:Reaction]] to force the creature to make a Constitution saving throw. On a failed save, the creature has the [[glossary:Blinded]] condition until the end of your next turn.
"""
source = "Player's Handbook, p. 277"
