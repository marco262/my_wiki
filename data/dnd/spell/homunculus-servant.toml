duration = "Instantaneous"
description = """
You summon a special homunculus in an unoccupied space within range. This creature uses the [[[monster:Homunculus Servant]]] stat block. If you already have a homunculus from this spell, the homunculus is replaced by the new one. You determine the homunculus's appearance, such as a mechanical-looking bird, winged vial, or miniature animate cauldron.

**_Combat._** The homunculus is an ally to you and your allies. In combat, it shares your [[glossary:Initiative]] count, but it takes its turn immediately after yours. It obeys your commands (no action required by you). If you don't issue any, it takes the [[glossary:Dodge]] action and uses its movement to avoid danger.
"""
at_higher_levels = "Use the spell slot's level for the spell's level in the stat block."
source = "Eberron: Forge of the Artificer, p. 21"
