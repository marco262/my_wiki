title = "Eyebite"
spell_lists = ["Bard", "Sorcerer", "Warlock", "Wizard"]
level = "6"
school = "Necromancy"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["V", "S"]
duration = "1 minute"
description = """
For the duration, your eyes become an inky void. One creature of your choice within 60 feet of you that you can see must succeed on a Wisdom saving throw or be affected by one of the following effects of your choice for the duration.

On each of your turns until the spell ends, you can take a [[glossary:Magic]] action to target another creature but can't target a creature again if it has succeeded on a save against this casting of the spell.

**_Asleep._** The target has the [[glossary:Unconscious]] condition. It wakes up if it takes any damage or if another creature takes an action to shake it awake.

**_Panicked._** The target has the [[glossary:Frightened]] condition. On each of its turns, the [[glossary:Frightened]] target must take the [[glossary:Dash]] action and move away from you by the safest and shortest route available. If the target moves to a space at least 60 feet away from you where it can't see you, this effect ends.

**_Sickened._** The target has the [[glossary:Poisoned]] condition.
"""
source = "Player's Handbook, p. 270"
