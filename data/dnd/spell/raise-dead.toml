title = "Raise Dead"
spell_lists = ["Bard", "Cleric", "Paladin"]
level = "5"
school = "Necromancy"
concentration_spell = false
ritual_spell = false
casting_time = "1 hour"
range = "Touch"
components = ["V", "S", "M"]
material = "a diamond worth 500+ GP, which the spell consumes"
expensive_material_component = true
material_component_cost = 50000
material_component_consumed = true
duration = "Instantaneous"
description = """
With a touch, you revive a dead creature if it has been dead no longer than 10 days and it wasn't Undead when it died.

The creature returns to life with 1 [[glossary:Hit Points]]. This spell also neutralizes any poisons that affected the creature at the time of death.

This spell closes all mortal wounds, but it doesn't restore missing body parts. If the creature is lacking body parts or organs integral for its survival -- its head, for instance -- the spell automatically fails.

Coming back from the dead is an ordeal. The target takes a -4 penalty to [[glossary:D20 Test]]. Every time the target finishes a [[glossary:Long Rest]], the penalty is reduced by 1 until it becomes 0.
"""
source = "Player's Handbook, p. 310"
