title = "Blade Barrier"
spell_lists = ["Cleric"]
level = "6"
school = "Evocation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "90 feet"
components = ["V", "S"]
duration = "10 minutes"
description = """
You create a wall of whirling blades made of magical energy. The wall appears within range and lasts for the duration. You make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick. The wall provides Three-Quarters [[glossary:Cover]], and its space is [[glossary:Difficult Terrain]].

Any creature in the wall's space makes a Dexterity saving throw, taking 6d10 Force damage on a failed save or half as much damage on a successful one. A creature also makes that save if it enters the wall's space or ends it turn there. A creature makes that save only once per turn.
"""
source = "Player's Handbook, p. 247"
