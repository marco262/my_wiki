title = "Mordenkainen's Faithful Hound"
spell_lists = ["Wizard"]
level = "4"
school = "Conjuration"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "30 feet"
components = ["V", "S", "M"]
material = "a silver whistle"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "8 hours"
description = """
You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other.

No one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has [[glossary:Truesight]] with a range of 30 feet.

At the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage.

On your later turns, you can take a [[glossary:Magic]] action to move the hound up to 30 feet.
"""
source = "Player's Handbook, p. 300"
