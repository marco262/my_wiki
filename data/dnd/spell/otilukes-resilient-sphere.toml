concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "30 feet"
components = ["V", "S", "M"]
material = "a glass sphere"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
A shimmering sphere encloses a Large or smaller creature or object within range. An unwilling creature must succeed on a Dexterity saving throw or be enclosed for the duration.

Nothing -- not physical objects, energy, or other spell effects -- can pass through the barrier, in or out, though a creature in the sphere can breathe there. The sphere is immune to all damage, and a creature or object inside can't be damaged by attacks or effects originating from outside, nor can a creature inside the sphere damage anything outside it.

The sphere is weightless and just large enough to contain the creature or object inside. An enclosed creature can take an action to push against the sphere's walls and thus roll the sphere at up to half the creature's [[glossary:Speed]]. Similarly, the globe can be picked up and moved by other creatures.

A [[[spell:Disintegrate]]] spell targeting the globe destroys it without harming anything inside.
"""
source = "Player's Handbook, p. 303"
