title = "Conjure Woodland Beings"
spell_lists = ["Druid", "Ranger"]
level = "4"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (10-foot [[glossary:emanation]])"
components = ["V", "S"]
duration = "10 minutes"
description = """
You conjure nature spirits that flit around you in a 10-foot [[glossary:Emanation]] for the duration. Whenever the [[glossary:Emanation]] enters the space of a creature you can see and whenever a creature you can see enters the [[glossary:Emanation]] or ends its turn there, you can force that creature to make a Wisdom saving throw. The creature takes 5d8 Force damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.

In addition, you can take the [[glossary:Disengage]] action as a [[glossary:Bonus Action]] for the spell's duration.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 4."
source = "Player's Handbook, p. 255"
