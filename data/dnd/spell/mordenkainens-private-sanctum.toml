title = "Mordenkainen's Private Sanctum"
spell_lists = ["Wizard"]
level = "4"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "10 minutes"
range = "120 feet"
components = ["V", "S", "M"]
material = "a thin sheet of lead"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "24 hours"
description = """
You make an area within range magically secure. The area is a [[glossary:Cube]] that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration.

When you cast the spell, you decide what sort of security the spell provides, choosing any of the following properties:

 - Sound can't pass through the barrier at the edge of the warded area.
 - The barrier of the warded area appears dark and foggy, preventing vision (including [[glossary:Darkvision]]) through it.
 - Sensors created by Divination spells can't appear inside the protected area or pass through the barrier at its perimeter.
 - Creatures in the area can't be targeted by Divination spells.
 - Nothing can teleport into or out of the warded area.
 - Planar travel is blocked within the warded area.

Casting this spell on the same spot every day for 365 days makes the spell last until dispelled.
"""
at_higher_levels = "You can increase the size of the [[glossary:Cube]] by 100 feet for each spell slot level above 4."
source = "Player's Handbook, p. 301"
