source = "Dungeon Master's Guide, p. 252"
description = """
While wearing this armor, you gain a +1 bonus to [[glossary:Armor Class]], and you know Abyssal. In addition, the armor's clawed gauntlets allow your Unarmed Strikes to deal 1d8 Slashing damage instead of the usual Bludgeoning damage, and you gain a +1 bonus to the attack and damage rolls of your Unarmed Strikes.

**_Curse._** Once you don this cursed armor, you can't doff it unless you are targeted by a [[[spell:Remove Curse]]] spell or similar magic. While wearing the armor, you have [[glossary:Disadvantage]] on attack rolls against demons and on saving throws against their spells and special abilities.
"""
