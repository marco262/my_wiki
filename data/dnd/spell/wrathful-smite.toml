description = "The target takes an extra 1d6 Necrotic damage from the attack, and it must succeed on a Wisdom saving throw or have the [[glossary:Frightened]] condition until the spell ends. At the end of each of its turns, the [[glossary:Frightened]] target repeats the save, ending the spell on itself on a success."
