title = "Thunderwave"
spell_lists = ["Bard", "Druid", "Sorcerer", "Wizard"]
level = "1"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Self (15-foot [[glossary:cube]])"
components = ["V", "S"]
duration = "Instantaneous"
description = """
You unleash a wave of thunderous energy. Each creature in a 15-foot [[glossary:Cube]] originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.

In addition, unsecured objects that are entirely within the [[glossary:Cube]] are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 1."
source = "Player's Handbook, p. 334"
