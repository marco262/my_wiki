title = "Counterspell"
spell_lists = ["Sorcerer", "Warlock", "Wizard"]
level = "3"
school = "Abjuration"
concentration_spell = false
ritual_spell = false
casting_time = "Reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components"
range = "60 feet"
components = ["S"]
duration = "Instantaneous"
description = "You attempt to interrupt a creature in the process of casting a spell. The creature makes a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, [[glossary:Bonus Action]], or [[glossary:Reaction]] used to cast it is wasted. If that spell was cast with a spell slot, the slot isn't expended."
source = "Player's Handbook, p. 258"
