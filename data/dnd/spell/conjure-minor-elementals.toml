title = "Conjure Minor Elementals"
spell_lists = ["Druid", "Wizard"]
level = "4"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (15-foot [[glossary:emanation]])"
components = ["V", "S"]
duration = "10 minutes"
description = """
You conjure spirits from the Elemental Planes that flit around you in a 15-foot [[glossary:Emanation]] for the duration. Until the spell ends, any attack you make deals an extra 2d8 damage when you hit a creature in the [[glossary:Emanation]]. This damage is Acid, Cold, Fire, or Lightning (your choice when you make the attack).

In addition, the ground in the [[glossary:Emanation]] is [[glossary:Difficult Terrain]] for your enemies.
"""
at_higher_levels = "The damage increases by 1d8 for each spell slot level above 4."
source = "Player's Handbook, p. 255"
