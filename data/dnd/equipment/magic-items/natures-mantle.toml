This cloak shifts color and texture to blend with the terrain surrounding you. While wearing the cloak, you can use it as a [[glossary:Spellcasting Focus]] for your Druid and Ranger spells.

While you are in an area that is [[glossary:Lightly Obscured]], you can [[glossary:Hide]] as a [[glossary:Bonus Action]] even if you are being directly observed.
