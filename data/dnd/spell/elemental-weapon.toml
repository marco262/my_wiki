title = "Elemental Weapon"
spell_lists = ["Artificer", "Druid", "Paladin", "Ranger"]
level = "3"
school = "Transmutation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Touch"
components = ["V", "S"]
duration = "1 hour"
description = "A nonmagical weapon you touch becomes a magic weapon. Choose one of the following damage types: Acid, Cold, Fire, Lightning, or Thunder. For the duration, the weapon has a +1 bonus to attack rolls and deals an extra 1d4 damage of the chosen type when it hits."
at_higher_levels = "If you use a level 5-6 spell slot, the bonus to attack rolls increases to +2, and the extra damage increases to 2d4. If you use a level 7+ spell slot, the bonus increases to +3, and the extra damage increases to 3d4."
source = "Player's Handbook, p. 267"
