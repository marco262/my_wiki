title = "Jallarzi's Storm of Radiance"
spell_lists = ["Warlock", "Wizard"]
level = "5"
school = "Evocation"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S", "M"]
material = "a pinch of phosphorus"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
You unleash a storm of flashing light and raging thunder in a 10-foot-radius, 40-foot-high [[glossary:Cylinder]] centered on a point you can see within range. While in this area, creatures have the [[glossary:Blinded]] and [[glossary:Deafened]] conditions, and they can't cast spells with a Verbal component.

When the storm appears, each creature in it makes a Constitution saving throw, taking 2d10 Radiant damage and 2d10 Thunder damage on a failed save or half as much damage on a successful one. A creature also makes this save when it enters the spell's area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.
"""
at_higher_levels = "The Radiant and Thunder damage increase by 1d10 for each spell slot level above 5."
source = "Player's Handbook, p. 289"
