duration = "1 minute"
description = """
You create a twisting pattern of colors in a 30-foot [[glossary:Cube]] within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the [[glossary:Charmed]] condition for the duration. While [[glossary:Charmed]], the creature has the [[glossary:Incapacitated]] condition and a [[glossary:Speed]] of 0.

The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.
"""
source = "Player's Handbook, p. 287"
