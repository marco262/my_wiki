material_component_consumed = false
duration = "1 minute"
description = """
Each creature of your choice in a 5-foot-radius [[glossary:Sphere]] centered on a point within range must succeed on a Wisdom saving throw or have the [[glossary:Incapacitated]] condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the [[glossary:Unconscious]] condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect.

Creatures that don't sleep, such as elves, or that have [[glossary:Immunity]] to the [[glossary:Exhaustion]] condition automatically succeed on saves against this spell.
"""
source = "Player's Handbook, p. 317"
