description = """
While wearing this pendant, you gain the following benefits.

**_Life Preservation._** Whenever you make a [[glossary:Death Saving Throw]], you can change a roll of 9 or lower to a 10, turning a failed save into a successful one.

**_Natural Healing Boost._** Whenever you roll a [[glossary:Hit Point Dice]] to regain [[glossary:Hit Points]], double the number of [[glossary:Hit Points]] it restores.
