title = "Fear"
spell_lists = ["Bard", "Sorcerer", "Warlock", "Wizard"]
level = "3"
school = "Illusion"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (30-foot [[glossary:cone]])"
components = ["V", "S", "M"]
material = "a white feather"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
Each creature in a 30-foot [[glossary:Cone]] must succeed on a Wisdom saving throw or drop whatever it is holding and have the [[glossary:Frightened]] condition for the duration.

A [[glossary:Frightened]] creature takes the [[glossary:Dash]] action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space where it doesn't have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature.
"""
source = "Player's Handbook, p. 271"
