Choose a willing creature that you can see within range. Until the spell ends, the target's [[glossary:Speed]] is doubled, it gains a +2 bonus to [[glossary:Armor Class]], it has [[glossary:Advantage]] on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the [[glossary:Attack]] (one attack only), [[glossary:Dash]], [[glossary:Disengage]], [[glossary:Hide]], or [[glossary:Utilize]] action.

