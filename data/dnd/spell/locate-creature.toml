title = "Locate Creature"
spell_lists = ["Bard", "Cleric", "Druid", "Paladin", "Ranger", "Wizard"]
level = "4"
school = "Divination"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self"
components = ["V", "S", "M"]
material = "fur from a bloodhound"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 hour"
description = """
Describe or name a creature that is familiar to you. You sense the direction to the creature's location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement.

The spell can locate a specific creature known to you or the nearest creature of a specific kind (such as a human or a unicorn) if you have seen such a creature up close -- within 30 feet -- at least once. If the creature you described or named is in a different form, such as under the effects of a [[[spell:Flesh to Stone]]] or [[[spell:Polymorph]]] spell, this spell doesn't locate the creature.

This spell can't locate a creature if any thickness of lead blocks a direct path between you and the creature.
"""
source = "Player's Handbook, p. 292"
