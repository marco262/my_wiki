title = "Find Traps"
spell_lists = ["Cleric", "Druid", "Ranger"]
level = "2"
school = "Divination"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "120 feet"
components = ["V", "S"]
duration = "Instantaneous"
description = """
You sense any trap within range that is within line of sight. A trap, for the purpose of this spell, includes any object or mechanism that was created to cause damage or other danger. Thus, the spell would sense the _[[[spell:Alarm]]]_ or _[[[spell:Glyph of Warding]]]_ spell or a mechanical pit trap, but it wouldn't reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole.

This spell reveals that a trap is present but not its location. You do learn the general nature of the danger posed by a trap you sense.
"""
source = "Player's Handbook, p. 273"
