title = "Animal Messenger"
spell_lists = ["Bard", "Druid", "Ranger"]
level = "2"
school = "Enchantment"
concentration_spell = false
ritual_spell = true
casting_time = "Action"
range = "30 feet"
components = ["V", "S", "M"]
material = "a morsel of food"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "24 hours"
description = """
A Tiny Beast of your choice that you can see within range must succeed on a Charisma saving throw, or it attempts to deliver a message for you (if the target's [[glossary:Challenge Rating]] isn't 0, it automatically succeeds). You specify a location you have visited and a recipient who matches a general description, such as "a person dressed in the uniform of the town guard" or "a red-haired dwarf wearing a pointed hat." You also communicate a message of up to twenty-five words. The Beast travels for the duration toward the specified location, covering about 25 miles per 24 hours or 50 miles if the Beast can fly.

When the Beast arrives, it delivers your message to the creature that you described, mimicking your communication. If the Beast doesn't reach its destination before the spell ends, the message is lost, and the Beast returns to where you cast the spell.
"""
at_higher_levels = "The spell's duration increases by 48 hours for each spell slot level above 2."
source = "Player's Handbook, p. 240"
