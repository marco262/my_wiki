title = "Antilife Shell"
spell_lists = ["Druid"]
level = "5"
school = "Abjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "Self (10-foot [[glossary:emanation]])"
components = ["V", "S"]
duration = "1 hour"
description = """
An aura extends from you in a 10-foot [[glossary:Emanation]] for the duration. The aura prevents creatures other than Constructs and Undead from passing or reaching through it. An affected creature can cast spells or make attacks with Ranged or Reach weapons through the barrier.

If you move so that an affected creature is forced to pass through the barrier, the spell ends.
"""
source = "Player's Handbook, p. 241"
