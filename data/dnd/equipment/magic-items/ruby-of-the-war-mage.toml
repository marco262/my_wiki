name = "Ruby of the War Mage"
type = "Wondrous Item"
subtype = ""
rarity = "Common"
tables = ["Arcana", "Relics"]
attunement = true
classes = ["spellcaster"]
notes = ""
source = "Dungeon Master's Guide, p. 302"
description = "Etched with eldritch runes, this 1-inch-diameter ruby allows you to use a Simple or Martial weapon as a [[glossary:Spellcasting Focus]] for your spells. For this property to work, you must attach the ruby to the weapon by pressing the ruby against it for at least 10 minutes. Thereafter, the ruby can't be removed unless you detach it as a [[glossary:Magic]] action, the weapon is destroyed, or your [[glossary:Attunement]] to the ruby ends."
