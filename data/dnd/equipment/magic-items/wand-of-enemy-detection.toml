name = "Wand of Enemy Detection"
type = "Wand"
subtype = ""
rarity = "Rare"
tables = ["Implements", "Implements"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 319"
description = """
This wand has 7 charges. While holding it, you can take a [[glossary:Magic]] action to expend 1 charge. For 1 minute, you know the direction of the nearest creature [[glossary:Hostile]] to you within 60 feet, but not its distance from you. The wand can sense the presence of [[glossary:Hostile]] creatures that are [[glossary:Invisible]], ethereal, disguised, or hidden, as well as those in plain sight. The effect ends if you stop holding the wand.

**_Regaining Charges._** The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll 1d20. On a 1, the wand crumbles into ashes and is destroyed.
"""
