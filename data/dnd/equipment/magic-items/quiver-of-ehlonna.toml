description = """
Each of the quiver's three compartments connects to an extradimensional space that allows the quiver to hold numerous items while never weighing more than 2 pounds. The shortest compartment can hold up to 60 [[tooltip:Arrow]], [[tooltip:Bolt]], or similar objects. The midsize compartment holds up to 18 [[tooltip:Javelin]] or similar objects. The longest compartment holds up to 6 long objects, such as bows, [[tooltip:Quarterstaff]], or [[tooltip:Spear]].

You can draw any item the quiver contains as if doing so from a regular quiver or scabbard.
