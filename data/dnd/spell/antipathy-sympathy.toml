title = "Antipathy/Sympathy"
spell_lists = ["Bard", "Druid", "Wizard"]
level = "8"
school = "Enchantment"
concentration_spell = false
ritual_spell = false
casting_time = "1 hour"
range = "60 feet"
components = ["V", "S", "M"]
material = "a mix of vinegar and honey"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "10 days"
description = """
As you cast the spell, choose whether it creates antipathy or sympathy, and target one creature or object that is Huge or smaller. Then specify a kind of creature, such as red dragons, goblins, or vampires. A creature of the chosen kind makes a Wisdom saving throw when it comes within 120 feet of the target. Your choice of antipathy or sympathy determines what happens to a creature when it fails that save:

 - **Antipathy** The creature has the [[glossary:Frightened]] condition. The [[glossary:Frightened]] creature must use its movement on its turns to get as far away as possible from the target, moving by the safest route.
 - **Sympathy** The creature has the [[glossary:Charmed]] condition. The [[glossary:Charmed]] creature must use its movement on its turns to get as close as possible to the target, moving by the safest route. If the creature is within 5 feet of the target, the creature can't willingly move away. If the target damages the [[glossary:Charmed]] creature, that creature can make a Wisdom saving throw to end the effect, as described below.

**_Ending the Effect._** If the [[glossary:Frightened]] or [[glossary:Charmed]] creature ends its turn more than 120 feet away from the target, the creature makes a Wisdom saving throw. On a successful save, the creature is no longer affected by the target. A creature that successfully saves against this effect is immune to it for 1 minute, after which it can be affected again.
"""
source = "Player's Handbook, p. 242"
