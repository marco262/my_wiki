material = "a legume seed"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 minute"
description = """
A [[glossary:Line]] of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the [[glossary:Line]] must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the [[glossary:Line]]. A creature that ends its turn in the [[glossary:Line]] must make the same save.

Any creature in the [[glossary:Line]] must spend 2 feet of movement for every 1 foot it moves when moving closer to you.

The gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance chance to extinguish them.

As a [[glossary:Bonus Action]] on your later turns, you can change the direction in which the [[glossary:Line]] blasts from you.
"""
source = "Player's Handbook, p. 282"
