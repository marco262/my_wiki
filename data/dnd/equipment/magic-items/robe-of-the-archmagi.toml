description = """
This elegant garment is made from exquisite cloth and adorned with runes.

You gain these benefits while wearing the robe.

**_Armor._** If you aren't wearing armor, your base [[glossary:Armor Class]] is 15 plus your Dexterity modifier.

**_Magic Resistance._** You have [[glossary:Advantage]] on saving throws against spells and other magical effects.

**_War Mage._** Your spell save DC and spell attack bonus each increase by 2.
