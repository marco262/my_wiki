title = "Banishing Smite"
spell_lists = ["Paladin"]
level = "5"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an [[glossary:Unarmed Strike]]"
range = "Self"
components = ["V"]
duration = "1 minute"
description = "The target hit by the attack roll takes an extra 5d10 Force damage from the attack. If the attack reduces the target to 50 [[glossary:Hit Points]] or fewer, the target must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the [[glossary:Incapacitated]] condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied."
source = "Player's Handbook, p. 245"
