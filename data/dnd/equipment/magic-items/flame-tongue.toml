source = "Dungeon Master's Guide, p. 263"
description = "While holding this magic weapon, you can take a [[glossary:Bonus Action]] and use a command word to cause flames to engulf the damage-dealing part of the weapon. These flames shed [[glossary:Bright Light]] in a 40-foot radius and [[glossary:Dim Light]] for an additional 40 feet. While the weapon is ablaze, it deals an extra 2d6 Fire damage on a hit. The flames last until you take a [[glossary:Bonus Action]] to issue the command again or until you drop, stow, or sheathe the weapon."
