description = """
This concoction looks, smells, and tastes like a [[tooltip:Potion of Healing]] or another beneficial potion. However, it is actually poison masked by illusion magic. [[[spell:Identify]]] reveals its true nature.

If you drink this potion, you take 4d6 Poison damage and must succeed on a DC 13 Constitution saving throw or have the [[glossary:Poisoned]] condition for 1 hour.
"""
