source = "Dungeon Master's Guide, p. 275"
description = "While lit, this hooded lantern burns for 6 hours on 1 pint of oil, shedding [[glossary:Bright Light]] in a 30-foot radius and [[glossary:Dim Light]] for an additional 30 feet. [[glossary:Invisible]] creatures and objects are visible as long as they are in the lantern's [[glossary:Bright Light]]. You can take a [[glossary:Utilize]] action to lower the hood, reducing the lantern's light to [[glossary:Dim Light]] in a 5-foot radius."
