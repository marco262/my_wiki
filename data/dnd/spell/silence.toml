title = "Silence"
spell_lists = ["Bard", "Cleric", "Ranger"]
level = "2"
school = "Illusion"
concentration_spell = true
ritual_spell = true
casting_time = "Action"
range = "120 feet"
components = ["V", "S"]
duration = "10 minutes"
description = "For the duration, no sound can be created within or pass through a 20-foot-radius [[glossary:Sphere]] centered on a point you choose within range. Any creature or object entirely inside the [[glossary:Sphere]] has [[glossary:Immunity]] to Thunder damage, and creatures have the [[glossary:Deafened]] condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there."
source = "Player's Handbook, p. 316"
