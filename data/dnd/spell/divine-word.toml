title = "Divine Word"
spell_lists = ["Cleric"]
level = "7"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Bonus Action"
range = "30 feet"
components = ["V"]
duration = "Instantaneous"
description = """
You utter a word imbued with power from the Upper Planes. Each creature of your choice in range makes a Charisma saving throw. On a failed save, a target that has 50 [[glossary:Hit Points]] or fewer suffers an effect based on its current [[glossary:Hit Points]], as shown in the Divine Word Effects table. Regardless of its [[glossary:Hit Points]], a Celestial, an Elemental, a Fey, or a Fiend target that fails its save is forced back to its plane of origin (if it isn't there already) and can't return to the current plane for 24 hours by any means short of a [[[spell:Wish]]] spell.

**Divine Word Effects**

| Hit Points | Effect                                                                                                                         |
|------------|--------------------------------------------------------------------------------------------------------------------------------|
| 0-20       | The target dies.                                                                                                               |
| 21-30      | The target has the [[glossary:Blinded]], [[glossary:Deafened]], and [[glossary:Stunned]] conditions for 1 hour. |
| 31-40      | The target has the [[glossary:Blinded]] and [[glossary:Deafened]] conditions for 10 minutes.                         |
| 41-50      | The target has the [[glossary:Deafened]] condition for 1 minute.                                                          |
"""
source = "Player's Handbook, p. 265"
