title = "Arms of Hadar"
spell_lists = ["Warlock"]
level = "1"
school = "Conjuration"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Self (10-foot [[glossary:emanation]])"
components = ["V", "S"]
duration = "Instantaneous"
description = "Invoking Hadar, you cause tendrils to erupt from yourself. Each creature in a 10-foot [[glossary:Emanation]] originating from you makes a Strength saving throw. On a failed save, a target takes 2d6 Necrotic damage and can't take Reactions until the start of its next turn. On a successful save, a target takes half as much damage only."
at_higher_levels = "The damage increases by 1d6 for each spell slot level above 1."
source = "Player's Handbook, p. 243"
