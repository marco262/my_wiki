title = "Maze"
spell_lists = ["Wizard"]
level = "8"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Action"
range = "60 feet"
components = ["V", "S"]
duration = "10 minutes"
description = """
You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze.

The target can take a [[glossary:Study]] action to try to escape. When it does so, it makes a DC 20 Intelligence ([[tooltip:Investigation]]) check. If it succeeds, it escapes, and the spell ends.

When the spell ends, the target reappears in the space it left or, if that space is occupied, in the nearest unoccupied space.
"""
source = "Player's Handbook, p. 296"
