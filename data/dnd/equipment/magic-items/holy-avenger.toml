name = "Holy Avenger"
type = "Weapon"
subtype = "Any Simple or Martial"
rarity = "Legendary"
tables = ["Armaments", "Relics"]
attunement = true
classes = ["Paladin"]
notes = ""
source = "Dungeon Master's Guide, p. 269"
description = """
You gain a +3 bonus to attack rolls and damage rolls made with this magic weapon. When you hit a Fiend or an Undead with it, that creature takes an extra 2d10 Radiant damage.

While you hold the drawn weapon, it creates a 10-foot [[glossary:Emanation]] originating from you. You and all creatures [[glossary:Friendly]] to you in the [[glossary:Emanation]] have [[glossary:Advantage]] on saving throws against spells and other magical effects. If you have 17 or more levels in the Paladin class, the size of the [[glossary:Emanation]] increases to 30 feet.
"""
