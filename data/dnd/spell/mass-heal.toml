description = "A flood of healing energy flows from you into creatures around you. You restore up to 700 [[glossary:Hit Points]], divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell also have the [[glossary:Blinded]], [[glossary:Deafened]], and [[glossary:Poisoned]] conditions removed from them."
source = "Player's Handbook, p. 296"
