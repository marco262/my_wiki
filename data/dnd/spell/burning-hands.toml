title = "Burning Hands"
spell_lists = ["Sorcerer", "Wizard"]
level = "1"
school = "Evocation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "Self (15-foot [[glossary:cone]])"
components = ["V", "S"]
duration = "Instantaneous"
description = """
A thin sheet of flames shoots forth from you. Each creature in a 15-foot [[glossary:Cone]] makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one.

Flammable objects in the [[glossary:Cone]] that aren't being worn or carried start [[glossary:burning]].
"""
