title = "Animal Shapes"
spell_lists = ["Druid"]
level = "8"
school = "Transmutation"
concentration_spell = false
ritual_spell = false
casting_time = "Action"
range = "30 feet"
components = ["V", "S"]
duration = "24 hours"
description = """
Choose any number of willing creatures that you can see within range. Each target shape-shifts into a Large or smaller Beast of your choice that has a [[glossary:Challenge Rating]] of 4 or lower. You can choose a different form for each target. On later turns, you can take a [[glossary:Magic]] action to transform the targets again.

A target's game statistics are replaced by the chosen Beast's statistics, but the target retains its creature type; [[glossary:Hit Points]]; [[glossary:Hit Point Dice]]; alignment; ability to communicate; and Intelligence, Wisdom, and Charisma scores. The target's actions are limited by the Beast form's anatomy, and it can't cast spells. The target's equipment melds into the new form, and the target can't use any of that equipment while in that form.

The target gains a number of [[glossary:Temporary Hit Points]] equal to the [[glossary:Hit Points]] of the first form into which it shape-shifts. These [[glossary:Temporary Hit Points]] vanish if any remain when the spell ends. The transformation lasts for the duration or until the target ends it as a [[glossary:Bonus Action]].
"""
source = "Player's Handbook, p. 240"
