name = "Instrument of the Bards, Doss Lute"
type = "Wondrous Item"
subtype = "Lute"
rarity = "Uncommon"
tables = ["Implements"]
attunement = true
classes = ["Bard"]
notes = ""
source = "Dungeon Master's Guide, p. 272"
description = """
An Instrument of the Bards is superior to an ordinary instrument in every way. Seven types of these instruments exist, each named after a bard college. A creature that attempts to play the instrument without being attuned to it must succeed on a DC 15 Wisdom saving throw or take 2d4 Psychic damage.

You can play the Doss [[tooltip:Lute]] to cast one of the following spells: [[[spell:Fly]]], [[[spell:Invisibility]]], [[[spell:Levitate]]], [[[spell:Protection from Evil and Good]]], [[[spell:Animal Friendship]]], [[[spell:Protection from Energy]]] (Fire damage only), and [[[spell:Protection from Poison]]]. Once the Doss [[tooltip:Lute]] has been used to cast a spell, it can't be used to cast that spell again until the next dawn. The spells use your spellcasting ability and spell save DC.
"""
