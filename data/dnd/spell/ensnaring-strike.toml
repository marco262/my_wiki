title = "Ensnaring Strike"
spell_lists = ["Ranger"]
level = "1"
school = "Conjuration"
concentration_spell = true
ritual_spell = false
casting_time = "Bonus Action, which you take immediately after hitting a creature with a weapon"
range = "Self"
components = ["V"]
duration = "1 minute"
description = """
As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has [[glossary:Advantage]] on this save. On a failed save, the target has the [[glossary:Restrained]] condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.

While [[glossary:Restrained]], the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength ([[tooltip:Athletics]]) check against your spell save DC. On a success, the spell ends.
"""
at_higher_levels = "The damage increases by 1d6 for each spell slot level above 1."
source = "Player's Handbook, p. 268"
