description = """
You conjure spinning daggers in a 5-foot [[glossary:Cube]] centered on a point within range. Each creature in that area takes 4d4 Slashing damage. A creature also takes this damage if it enters the [[glossary:Cube]] or ends its turn there or if the [[glossary:Cube]] moves into its space. A creature takes this damage only once per turn.

On your later turns, you can take a [[glossary:Magic]] action to teleport the [[glossary:Cube]] up to 30 feet.
"""
at_higher_levels = "The damage increases by 2d4 for each spell slot level above 2."
