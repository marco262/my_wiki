title = "Hex"
spell_lists = ["Warlock"]
level = "1"
school = "Enchantment"
concentration_spell = true
ritual_spell = false
casting_time = "Bonus Action"
range = "90 feet"
components = ["V", "S", "M"]
material = "the petrified eye of a newt"
expensive_material_component = false
material_component_cost = 0
material_component_consumed = false
duration = "1 hour"
description = """
You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has [[glossary:Disadvantage]] on ability checks made with the chosen ability.

If the target drops to 0 [[glossary:Hit Points]] before this spell ends, you can take a [[glossary:Bonus Action]] on a later turn to curse a new creature.
"""
at_higher_levels = "Your [[glossary:Concentration]] can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours)."
source = "Player's Handbook, p. 285"
