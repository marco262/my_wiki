description = "While you're wearing this armor, you can take a [[glossary:Magic]] action and use a command word to gain the effect of the [[[spell:Etherealness]]] spell. The spell ends immediately if you remove the armor or take a [[glossary:Magic]] action to repeat the command word. This property of the armor can't be used again until the next dawn."
