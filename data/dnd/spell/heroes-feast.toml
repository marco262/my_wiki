duration = "Instantaneous"
description = """
You conjure a feast that appears on a surface in an unoccupied 10-foot [[glossary:Cube]] next to you. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don't set in until this hour is over. Up to twelve creatures can partake of the feast.

A creature that partakes gains several benefits, which last for 24 hours. The creature has [[glossary:Resistance]] to Poison damage, and it has [[glossary:Immunity]] to the [[glossary:Frightened]] and [[glossary:Poisoned]] conditions. Its [[glossary:Hit Points]] maximum also increases by 2d10, and it gains the same number of [[glossary:Hit Points]].
"""
source = "Player's Handbook, p. 284"
