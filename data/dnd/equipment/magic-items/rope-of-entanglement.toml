attunement = false
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 301"
description = """
This rope is 30 feet long. While holding one end of the rope, you can take a [[glossary:Magic]] action to command the other end to dart forward and entangle one creature you can see within 20 feet of yourself. The target must succeed on a DC 15 Dexterity saving throw or have the [[glossary:Restrained]] condition. You can release the target by letting go of your end of the rope (causing the rope to coil up in the target's space) or by using a [[glossary:Bonus Action]] to repeat the command (causing the rope to coil up in your hand).

A target [[glossary:Restrained]] by the rope can take an action to make its choice of a DC 15 Strength ([[tooltip:Athletics]]) or Dexterity ([[tooltip:Acrobatics]]) check. On a successful check, the target is no longer [[glossary:Restrained]] by the rope. If you're still holding onto the rope when a target escapes from it, you can take a [[glossary:Reaction]] to command the rope to coil up in your hand; otherwise, the rope coils up in the target's space.

The rope has AC 20, HP 20, and [[glossary:Immunity]] to Poison and Psychic damage. It regains 1 [[glossary:Hit Points]] every 5 minutes as long as it has at least 1 [[glossary:Hit Points]]. If the rope drops to 0 [[glossary:Hit Points]], it is destroyed.
"""
