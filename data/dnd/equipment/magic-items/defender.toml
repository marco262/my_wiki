description = """
You gain a +3 bonus to attack rolls and damage rolls made with this magic weapon.

The first time you attack with the weapon on each of your turns, you can transfer some or all of the weapon's bonus to your [[glossary:Armor Class]]. For example, you could reduce the bonus to your attack rolls and damage rolls to +1 and gain a +2 bonus to [[glossary:Armor Class]]. The adjusted bonuses remain in effect until the start of your next turn, although you must hold the weapon to gain a bonus to AC from it.
"""
