name = "Staff of the Magi"
type = "Staff"
subtype = ""
rarity = "Legendary"
tables = ["Arcana"]
attunement = true
classes = ["Sorcerer", "Warlock", "Wizard"]
notes = ""
source = "Dungeon Master's Guide, p. 310"
description = """
This staff has 50 charges and can be wielded as a magic Quarterstaff that grants a +2 bonus to attack rolls and damage rolls made with it. While you hold it, you gain a +2 bonus to spell attack rolls.

**_Spell Absorption._** While holding the staff , you have [[glossary:Advantage]] on saving throws against spells. In addition, you can take a [[glossary:Reaction]] when another creature casts a spell that targets only you. If you do, the staff absorbs the magic of the spell, canceling its effect and gaining a number of charges equal to the absorbed spell's level. However, if doing so brings the staff's total number of charges above 50, the staff explodes as if you activated its Retributive Strike (see below).

**_Spells._** While holding the staff, you can cast one of the spells on the following table from it, using your spell save DC. The table indicates how many charges you must expend to cast the spell.

| Spell                                          | Charge Cost |
|------------------------------------------------|-------------|
| [[[spell:Arcane Lock]]]                      | 0           |
| [[[spell:Conjure Elemental]]]                | 7           |
| [[[spell:Detect Magic]]]                     | 0           |
| [[[spell:Dispel Magic]]]                     | 3           |
| [[[spell:Enlarge/Reduce]]]                   | 0           |
| [[[spell:Fireball]]] (level 7 version)       | 7           |
| [[[spell:Flaming Sphere]]]                   | 2           |
| [[[spell:Ice Storm]]]                        | 4           |
| [[[spell:Invisibility]]]                     | 2           |
| [[[spell:Knock]]]                            | 2           |
| [[[spell:Light]]]                            | 0           |
| [[[spell:Lightning Bolt]]] (level 7 version) | 7           |
| [[[spell:Mage Hand]]]                        | 0           |
| [[[spell:Passwall]]]                         | 5           |
| [[[spell:Plane Shift]]]                      | 7           |
| [[[spell:Protection from Evil and Good]]]    | 0           |
| [[[spell:Telekinesis]]]                      | 5           |
| [[[spell:Wall of Fire]]]                     | 4           |
| [[[spell:Web]]]                              | 2           |

**_Regaining Charges._** The staff regains 4d6 + 2 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 20, the staff regains 1d12 + 1 charges.

**_Retributive Strike._** You can take a [[glossary:Magic]] action to break the staff over your knee or against a solid surface. The staff is destroyed and releases its magic in an explosion that fills a 30-foot [[glossary:Emanation]] originating from itself. You have a {@chance 50} chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take Force damage equal to 16 times the number of charges in the staff. Each other creature in the area makes a DC 17 Dexterity saving throw. On a failed save, a creature takes Force damage equal to 6 times the number of charges in the staff. On a successful save, a creature takes half as much damage.
"""
