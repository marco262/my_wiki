name = "Arrow-Catching Shield"
type = "Armor"
subtype = "Shield"
rarity = "Rare"
tables = ["Armaments"]
attunement = true
classes = []
notes = ""
source = "Dungeon Master's Guide, p. 231"
description = """
You gain a +2 bonus to [[glossary:Armor Class]] against ranged attack rolls while you wield this Shield. This bonus is in addition to the Shield's normal bonus to AC.

Whenever an attacker makes a ranged attack roll against a target within 5 feet of you, you can take a [[glossary:Reaction]] to become the target of the attack instead.
"""
