source = "Dungeon Master's Guide, p. 244"
description = """
This fine garment is made of black silk interwoven with faint, silvery threads. While wearing it, you gain the following benefits.

**_Poison Resistance._** You have [[glossary:Resistance]] to Poison damage.

**_Spider Climb._** You have a [[glossary:Climb Speed]] equal to your [[glossary:Speed]] and can move up, down, and across vertical surfaces and along ceilings, while leaving your hands free.

**_Spider Walk._** You can't be caught in webs of any sort and can move through webs as if they were [[glossary:Difficult Terrain]].

**_Web._** You can cast [[[spell:Web]]] (save DC 13). The web created by the spell fills twice its normal area. Once used, this property can't be used again until the next dawn.
"""
