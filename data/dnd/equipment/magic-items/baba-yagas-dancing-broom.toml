source = "Dungeon Master's Guide, p. 232"
description = """
The archfey Baba Yaga crafted many of these magic brooms. No two appear exactly alike. While holding the broom, you can take a [[glossary:Magic]] action to transform it into an [[[monster:Animated Broom]]] under your control. The broom then moves into an unoccupied space as close to you as possible. The broom acts immediately after you on your [[glossary:Initiative]] count and remains animate until you take a [[glossary:Bonus Action]] and use a command word to render it inanimate.

On your turn, you can mentally command the animated broom if it is within 30 feet of you and you don't have the [[glossary:Incapacitated]] condition (no action required). You decide what action the broom takes and where it moves during its next turn, or you can issue it a general command, such as to attack your enemies or guard a location.

If the broom is reduced to 0 [[glossary:Hit Points]], it shatters and is destroyed. If the broom reverts to its inanimate form before losing all its [[glossary:Hit Points]] it regains all of them.
"""
