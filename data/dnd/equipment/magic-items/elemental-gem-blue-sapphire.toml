source = "Dungeon Master's Guide, p. 257"
description = "This gem contains a mote of elemental energy. When you take a [[glossary:Utilize]] action to break the gem, an [[[monster:Air Elemental]]] is summoned, and the gem ceases to be magical. The elemental appears in an unoccupied space as close to the broken gem as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your [[glossary:Initiative]] count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a [[glossary:Bonus Action]]."
