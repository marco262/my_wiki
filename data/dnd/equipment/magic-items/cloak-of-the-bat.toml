source = "Dungeon Master's Guide, p. 245"
description = """
While wearing this cloak, you have [[glossary:Advantage]] on Dexterity ([[tooltip:Stealth]]) checks. In an area of [[glossary:Dim Light]] or [[glossary:Darkness]], you can grip the edges of the cloak and use it to gain a [[glossary:Fly Speed]] of 40 feet. If you ever fail to grip the cloak's edges while flying in this way, or if you are no longer in [[glossary:Dim Light]] or [[glossary:Darkness]], you lose this [[glossary:Fly Speed]].

While wearing the cloak in an area of [[glossary:Dim Light]] or [[glossary:Darkness]], you can cast [[[spell:Polymorph]]] on yourself, shape-shifting into a [[[monster:Bat]]]. While in that form, you retain your Intelligence, Wisdom, and Charisma scores. The cloak can't be used this way again until the next dawn.
"""
