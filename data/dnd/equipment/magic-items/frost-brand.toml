description = """
When you hit with an attack roll using this magic weapon, the target takes an extra 1d6 Cold damage. In addition, while you hold the weapon, you have [[glossary:Resistance]] to Fire damage.

In freezing temperatures, the weapon sheds [[glossary:Bright Light]] in a 10-foot radius and [[glossary:Dim Light]] for an additional 10 feet.

When you draw this weapon, you can extinguish all nonmagical flames within 30 feet of yourself. Once used, this property can't be used again for 1 hour.
"""
